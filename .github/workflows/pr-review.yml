name: Claude PR Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number. Auto-detected from the triggering comment; pass it explicitly for `workflow_dispatch`."
        type: string
      command:
        description: "Review command, e.g. `/review code functional`. Leave empty on an `issue_comment` trigger — the workflow reads the comment body straight off the caller's event, which is why a caller needs no extra `with:` wiring for the common case. Set it only for `workflow_dispatch`, where there is no comment to read; an empty command there means a plain code review, because clicking Run workflow IS the opt-in."
        type: string
        default: ""
      command_trigger:
        description: "Prefix that starts a review command. Change it only if `/review` collides with another bot in your repo — it is quoted verbatim in the menu the reviewer posts back."
        type: string
        default: "/review"
      runner:
        description: "Runner label for the review job. Pass the SAME value to warm-cache.yml. Defaults to the `panenco-claude-review` ARC scale set. Set `ubuntu-latest` to run on GitHub-hosted instead — REQUIRED for any repo that is not a member of the `claude-review` org runner group, because ARC fails closed: an unreachable label does not fall back, it queues for GitHub's 24h timeout and then fails. The review job and warm-cache.yml must share a fleet: cache keys are scoped by OS+arch, so a hosted warm could never produce an entry an arm64 fleet can restore. Your fleet needs egress to the Actions cache service, else every review runs cold."
        type: string
        default: "panenco-claude-review"
      model_high:
        description: "The reviewing model. Runs both review subagents: review-scan at `effort: medium`, review-verify at `effort: low`. It no longer runs the top-level session — see `model_orchestrator`."
        type: string
        default: "claude-opus-5"
      model_orchestrator:
        description: "Model for the top-level orchestrator session. Deliberately NOT `model_high`: this session reviews nothing and writes no review prose — it makes ~7-12 API calls (one Read, one Bash, the Task dispatches, one jq) to fan out subagents and copy one file through. Measured at 7-19% of a run's spend for pure plumbing. Every subagent pins its own model in its installed frontmatter (`model_high` / `model_functional` / `model_standard`), so this value never reaches a reviewing pass."
        type: string
        default: "claude-sonnet-5"
      model_standard:
        description: "Model for the `/review native` second-opinion pass (Anthropic's official `code-review` plugin, run in-session). LIVE AGAIN as of ADR 0005 — it was a deprecated no-op while that pass was deleted. Deliberately not `model_high`: the plugin's own prompt fans out to ~10 short-lived subagents and picks their models itself."
        type: string
        default: "claude-sonnet-5"
      model_fast:
        description: "DEPRECATED and ignored — the Haiku judge it named no longer exists. Kept so callers passing it do not break."
        type: string
        default: "claude-haiku-4-5"
      model_functional:
        description: "Model for the functional tester (drives a real browser via the agent-browser CLI over Bash)."
        type: string
        default: "claude-sonnet-5"
      pipeline_ref:
        description: "Ref of panenco/claude-review to install skills/scripts from. Pin to a SHA or branch when testing pipeline changes."
        type: string
        default: "v3"
      dev_env_timeout_seconds:
        description: "How long to wait for the background dev-env (.github/claude-review/dev-start.sh) to come up. CLAMPED TO 540s by the orchestrator, so passing more than 540 buys nothing. The clamp is a courtesy, NOT the guarantee: the Bash tool ceiling is a per-call argument that defaults to 120s and tops out at 600s, so no fixed clamp can promise the call survives — what protects the run is that the wait is its OWN tool call (orchestrator turn 1b), so a kill costs the wait and nothing else. Never lower it below ~360 either: real bring-up measures 291-305s, and a shorter wait rules the tester ineligible on every consumer. The wait is skipped entirely when no dev-env was started (docs-only diff, no dev-start.sh, or no functional pass)."
        type: number
        default: 360
      functional_budget_seconds:
        description: "Wall-clock budget for the functional tester."
        type: number
        default: 480
      free_disk_space:
        description: "Runner disk to reclaim before dev-env bring-up: safe (default) | aggressive | off."
        type: string
        default: "safe"
      native_review_scope:
        description: "Optional path scope for the `/review native` second-opinion pass, as free text (e.g. `only review changes under apps/api/ and apps/web/`). LIVE AGAIN as of ADR 0005. It only ever NARROWS that pass; it never widens it and never touches the main review. Empty means the whole diff."
        type: string
        default: ""
      gate_skip_label:
        description: "Label that forces review_level=skip — an opt-out that outranks an explicit `/review` comment, so a repo can park a PR the bot must not touch."
        type: string
        default: "skip-review"
      gate_deep_label:
        description: "Label that overrides the oversized size ceiling, so a PR that genuinely cannot be split is reviewed anyway. Persistent: it applies to every push, where a `/review deep` comment applies only to the run it starts."
        type: string
        default: "deep-review"
      gate_small_ceiling:
        description: "DEPRECATED and ignored — no size tiers remain. Kept so callers passing it do not break."
        type: number
        default: 300
      gate_tiny_ceiling:
        description: "DEPRECATED and ignored — no size tiers remain. Kept so callers passing it do not break."
        type: number
        default: 10
      gate_size_ceiling:
        description: "Non-generated changed lines over which the PR is blocked with a split request instead of reviewed."
        type: number
        default: 3000
      gate_file_ceiling:
        description: "Changed (non-generated) files over which the PR is blocked with a split request instead of reviewed."
        type: number
        default: 60
      gate_generated_globs:
        description: "Extra globs for THIS repo's committed build output, on top of the built-in list (lockfiles, dist/, build/, openapi*/swagger* specs, schema.graphql, *.gen.*). Space-separated. They are excluded from the size count only — the reviewer still receives the whole diff."
        type: string
        default: ""
      gate_sensitive_globs:
        description: "DEPRECATED and ignored by the guard — review-verify applies the sensitive-path rule to the APPROVE bar instead. Kept so callers passing it do not break."
        type: string
        default: "*auth.* */oauth/* oauth.* */authentication/* authentication/* */authorization/* authorization/* */security/* security/* */payments/* payments/* */payment/* payment/* */migrations/* migrations/* */migration/* migration/*"
      gate_promotion_bases:
        description: "DEPRECATED and ignored — promotion PRs take the same path as any other. Kept so callers passing it do not break."
        type: string
        default: "main master production prod"
      gate_promotion_heads:
        description: "DEPRECATED and ignored — promotion PRs take the same path as any other. Kept so callers passing it do not break."
        type: string
        default: "staging develop dev release hotfix"
      dev_cache_paths:
        description: "Optional, stack-agnostic. Newline-separated filesystem paths to restore BEFORE the dev-env bring-up — and to warm/save in warm-cache.yml, which needs the same value — so dev-start.sh compiles/installs against a warm build/dependency cache instead of cold every run. Examples: `~/.gradle/caches/modules-2` + `~/.gradle/wrapper` (Gradle), `~/.m2/repository` (Maven), `~/.cache/go-build` + `~/go/pkg/mod` (Go), `~/.cargo` + `target` (Rust), `~/.cache/pip` (Python). Empty (default) disables it — no cache step runs and behaviour is unchanged. Pair with dev_cache_key_files. The pnpm/npm store is already cached separately, so this is for everything else dev-start.sh builds."
        type: string
        default: ""
      dev_cache_key_files:
        description: "Newline-separated file globs whose contents key the cache. The workflow computes the key itself — `<RUNNER_OS>-<RUNNER_ARCH>-<prefix>-<sha of these files>` — inside the jobs where a checkout + runner exist, so you pass globs (not a pre-hashed key): a reusable-workflow caller's `with:` has no runner/checkout, so `runner`/`hashFiles` can't be used there. Point it at the lockfiles/build descriptors that should rotate the cache, e.g. for Gradle: `backend/java/gradle/libs.versions.toml` + `backend/java/**/*.gradle*` + `backend/java/**/gradle-wrapper.properties`. Globs support `**` (globstar). Required when dev_cache_paths is set; if empty the cache is skipped."
        type: string
        default: ""
      dev_cache_key_prefix:
        description: "Optional cache-key prefix (default 'devcache'). The computed key is `<RUNNER_OS>-<RUNNER_ARCH>-<prefix>-<hash of dev_cache_key_files>`, and restore-keys fall back to `<RUNNER_OS>-<RUNNER_ARCH>-<prefix>-` (so a cold PR prefix-matches the latest main-scope entry; caches are repo-scoped, so a cache your main CI writes under the same prefix is reused too). Set it per stack (e.g. 'gradle') so unrelated caches don't collide. Note the arch scoping: a cache your main CI writes under the same prefix is only reused if that CI runs on the same OS+arch."
        type: string
        default: "devcache"
      dev_cache_warm_command:
        description: "Accepted but UNUSED here — this workflow only restores. Pass it to warm-cache.yml, which owns the warm and the save; it is kept in this signature so a caller can hold all four dev_cache_* values in one place and forward them to both workflows."
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Single Claude OAuth token. Either this or CLAUDE_CODE_OAUTH_TOKENS is required."
      CLAUDE_CODE_OAUTH_TOKENS:
        description: "Optional newline-separated pool of Claude OAuth tokens; the picker probes each and picks one with remaining quota."
      CLAUDE_REVIEW_APP_CLIENT_ID:
      CLAUDE_REVIEW_APP_PRIVATE_KEY:
      CLAUDE_REVIEW_APP_SLUG:
      TRACKER_SECRETS:
        # LIVE. Forwarded to the orchestrate step, where scripts/build-spec.sh
        # exports each KEY=VALUE line as a named env var for the consumer's
        # .github/claude-review/fetch-issue.sh hook (same parser as
        # DEV_ENV_SECRETS — scripts/kv-secrets.sh). It briefly went unforwarded
        # in v4; a repo tracking work in Linear/Jira got a reviewer with no
        # requirements at all, which is why the seam is now pinned by
        # tests/pipeline_contract_test.sh.
        description: "Optional newline-separated KEY=VALUE pairs exposed as env vars to .github/claude-review/fetch-issue.sh."
      DEV_ENV_SECRETS:
        description: "Optional newline-separated KEY=VALUE pairs exposed to .github/claude-review/dev-start.sh."

# Pinned browser stack, decoupled from consumer-lockfile churn so the
# browser-binary cache hits every run that doesn't bump it.
#
# ONE pin, not two. agent-browser is a single static binary that downloads its
# own Chrome for Testing build, and `agent-browser install` takes no --version:
# the Chrome build is determined by the CLI version. So this key covers the CLI
# and the browser together, and there is no second spec (the old
# @playwright/mcp pin) that can drift away from it.
#
# LOCKSTEP with Panenco/github-action-runners images/versions.env
# (AGENT_BROWSER_VERSION, image G). A mismatch is SILENT: reviews still pass,
# they just re-download the binary instead of using the prebake.
env:
  AGENT_BROWSER_VERSION: "0.34.0"

jobs:
  review:
    name: In-Depth Review
    # THE AUTHORIZATION GATE. A `/review` comment spends Claude quota and boots the
    # dev environment on our runners, and on a public repo anyone can comment — so
    # require write access. OWNER/MEMBER/COLLABORATOR is the write-access triple;
    # CONTRIBUTOR only means "has had a PR merged" and must stay out. It lives at
    # JOB level, not in review-command.sh, so an outsider never claims a runner.
    # The Bot clause is loop protection: this job answers bad commands by posting a
    # comment, which fires issue_comment again.
    #
    # An ALLOWLIST, not a denylist. It used to exclude `pull_request_target` and
    # admit everything else, which was safe only while `pull_request_target` was
    # the sole other trigger a caller was told to wire. Callers now add
    # write-capable triggers for warm-cache.yml (`push`, `schedule`, …), and under
    # a denylist every one of those would have started an unasked review with no
    # PR number to review.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    # Queue, never cancel: a second request is a human asking for something, and two
    # overlapping runs would post two reviews and race on the review-assets branch.
    # Several passes in ONE comment (`/review code functional`) is the fast path.
    concurrency:
      group: claude-review-pr-${{ github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write # screenshot upload to the review-assets branch
      pull-requests: write
      issues: write
      packages: read
    # A PR comment arrives as an `issue` event — the payload has no `pull_request`
    # object at all. Resolved once here so no step re-derives it.
    env:
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}

    steps:
      # workflow_dispatch's github.sha is NOT the PR head — resolve via API
      # and re-verify the head lives in this repo (fork guard for dispatch).
      - name: Resolve PR head SHA
        id: pr_sha
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          date +%s > /tmp/job-start
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::No PR number (event: $GITHUB_EVENT_NAME) — nothing to review."
            case "$GITHUB_EVENT_NAME" in
              pull_request*) echo "::error::This pipeline is ON DEMAND and no longer reviews on push. Trigger the caller on 'issue_comment' (prompts/setup-review.md Step 2) and ask with '/review code'." ;;
              issue_comment) echo "::error::That comment was not on a pull request — the caller's job-level if: should have filtered it." ;;
              *)             echo "::error::Pass the pr_number input." ;;
            esac
            exit 1
          fi
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRepositoryOwner,headRepository,author)
          SHA=$(jq -r '.headRefOid // empty' <<< "$PR_JSON")
          HEAD_OWNER=$(jq -r '.headRepositoryOwner.login // empty' <<< "$PR_JSON")
          HEAD_NAME=$(jq -r '.headRepository.name // empty' <<< "$PR_JSON")
          HEAD_REPO="$HEAD_OWNER/$HEAD_NAME"

          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve PR head SHA for PR #$PR_NUMBER"
            exit 1
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$PR_NUMBER head is in $HEAD_REPO, not $GITHUB_REPOSITORY. Fork PRs are not supported — the PR head must be in the same repository."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "author_is_bot=$(jq -r '.author.is_bot // false' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER head SHA: $SHA (origin $HEAD_REPO)"

      # Full clone: round-2 needs `git diff PRIOR_HEAD...HEAD` to always be
      # computable, so since-last scoping never degrades to a full re-review.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr_sha.outputs.sha }}
          fetch-depth: 0
          filter: blob:none

      # DOGFOOD installs from the local checkout; DOWNSTREAM installs at
      # pipeline_ref (a reusable workflow can't observe its own ref).
      - name: Install review pipeline (dogfood — local checkout)
        if: github.repository == 'panenco/claude-review'
        uses: ./

      - name: Checkout review pipeline at pipeline_ref (downstream)
        if: github.repository != 'panenco/claude-review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: panenco/claude-review
          ref: ${{ inputs.pipeline_ref }}
          path: __claude-review-pipeline

      - name: Install review pipeline (downstream — at pipeline_ref)
        if: github.repository != 'panenco/claude-review'
        uses: ./__claude-review-pipeline

      # Fail loudly here rather than with a bare `exit 127` fourteen minutes
      # later, at the poster, after the whole review has already been paid for.
      - name: Verify the script install resolved
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CLAUDE_REVIEW_SCRIPTS:-}" ] || [ ! -d "$CLAUDE_REVIEW_SCRIPTS" ]; then
            echo "::error::CLAUDE_REVIEW_SCRIPTS is unset or missing — the install step did not run, or action.yml and pr-review.yml are from different versions."
            exit 1
          fi
          for s in post-review.sh guard.sh review-command.sh prior-review-state.sh prior-findings.sh pick-oauth-token.sh setup-dev-env.sh build-spec.sh upload-screenshots.sh validate-screenshots.sh shard-plan.sh merge-scans.sh; do
            if [ ! -x "$CLAUDE_REVIEW_SCRIPTS/$s" ]; then
              echo "::error::$CLAUDE_REVIEW_SCRIPTS/$s is missing or not executable."
              exit 1
            fi
          done
          case "$CLAUDE_REVIEW_SCRIPTS" in
            "${GITHUB_WORKSPACE}"/*)
              echo "::error::CLAUDE_REVIEW_SCRIPTS is inside the git workspace ($CLAUDE_REVIEW_SCRIPTS). A subagent's git stash/clean/checkout would delete the pipeline's own scripts mid-run."
              exit 1 ;;
          esac
          echo "Scripts resolved: $CLAUDE_REVIEW_SCRIPTS"

      # Optional GitHub App review identity; falls back to github-actions[bot].
      # APP_SLUG is required because installation tokens can't query /user.
      - name: Generate review token
        id: review_token
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CLAUDE_REVIEW_APP_CLIENT_ID }}
          APP_SLUG: ${{ secrets.CLAUDE_REVIEW_APP_SLUG }}
        run: |
          if [ -n "$APP_CLIENT_ID" ]; then
            if [ -z "$APP_SLUG" ]; then
              echo "::error::CLAUDE_REVIEW_APP_CLIENT_ID is set but CLAUDE_REVIEW_APP_SLUG is not."
              echo "::error::Find your app slug in the App's settings URL (github.com/apps/<slug>) and add it as a repo secret named CLAUDE_REVIEW_APP_SLUG."
              exit 1
            fi
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app_token
        if: steps.review_token.outputs.has_app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUDE_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}

      - name: Resolve review identity
        id: review_identity
        shell: bash
        env:
          HAS_APP: ${{ steps.review_token.outputs.has_app }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ secrets.CLAUDE_REVIEW_APP_SLUG }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$HAS_APP" = "true" ] && [ -n "$APP_TOKEN" ]; then
            BOT_USER="${APP_SLUG}[bot]"
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            BOT_USER="github-actions[bot]"
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          fi
          echo "bot_user=$BOT_USER" >> "$GITHUB_OUTPUT"
          echo "Review identity: $BOT_USER"

      # Which passes did the comment ask for? Depth is not opt-in — review-scan
      # scales itself, and guard.sh below only decides whether a model runs at all. A reusable workflow sees the CALLER's event, so
      # the body needs no `with:` wiring; `inputs.command` covers workflow_dispatch.
      - name: Parse review command
        id: cmd
        shell: bash
        env:
          CMD_BODY: ${{ github.event.comment.body || inputs.command }}
          CMD_TRIGGER: ${{ inputs.command_trigger }}
          CMD_EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          DECISION=$("$CLAUDE_REVIEW_SCRIPTS"/review-command.sh)
          echo "Review command:"; echo "$DECISION" | sed 's/^/  /'
          # No `-e` (repo rule): a failed parse would go green with `proceed` empty and
          # skip everything below, so the request would vanish without a word.
          if ! grep -qE '^action=(run|help|unknown|ignore)$' <<< "$DECISION"; then
            echo "::error::review-command.sh produced no usable decision — refusing to guess which passes were requested."
            exit 1
          fi
          {
            grep -E '^(action|run_functional|run_native|force_deep|passes)=' <<< "$DECISION"
            echo "message<<__CMD_EOF__"
            grep '^message=' <<< "$DECISION" | cut -d= -f2-
            echo "__CMD_EOF__"
          } >> "$GITHUB_OUTPUT"
          ACTION=$(grep '^action=' <<< "$DECISION" | cut -d= -f2)
          if [ "$ACTION" = "run" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No review dispatched (action=$ACTION)."
          fi

      # Tell the reviewer we heard them, without adding comment noise.
      - name: Acknowledge the request
        if: steps.cmd.outputs.proceed == 'true' && github.event_name == 'issue_comment'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review_identity.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -uo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --silent || echo "::warning::Could not react to the triggering comment."

      # A run that PROCEEDS can still carry a message. No token emits one today
      # (the `native` removal notice this was built for is gone — ADR 0005 turned
      # that pass back on), but the CHANNEL stays wired: the menu step below is
      # gated on `proceed != 'true'`, so a notice attached to a proceeding run has
      # no other way out. Deleting this is how `/review native` once rendered a
      # notice that was never posted. The step self-gates on a non-empty message.
      - name: Note a run-time notice
        if: steps.cmd.outputs.proceed == 'true' && steps.cmd.outputs.message != '' && github.event_name == 'issue_comment'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review_identity.outputs.token }}
          MESSAGE: ${{ steps.cmd.outputs.message }}
        run: |
          set -uo pipefail
          printf '%s\n' "$MESSAGE" | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - \
            || echo "::warning::Could not post the removed-pass notice."

      # A bare or mistyped command must answer — otherwise the reviewer waits for
      # something that never arrives. `ignore` stays silent: it wasn't for us.
      - name: Reply with the command menu
        if: steps.cmd.outputs.proceed != 'true' && steps.cmd.outputs.action != 'ignore' && github.event_name == 'issue_comment'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review_identity.outputs.token }}
          MESSAGE: ${{ steps.cmd.outputs.message }}
        run: |
          set -uo pipefail
          printf '%s\n' "$MESSAGE" | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - \
            || echo "::warning::Could not post the command menu."

      - name: Detect code changes
        id: code_check
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          DOCS_ONLY_PATTERN='^(README|CHANGELOG|CONTRIBUTING|CLAUDE|AGENTS|GEMINI)\.md$|^docs/|^LICENSE$'
          NON_DOCS=$(echo "$FILES" | grep -vE "$DOCS_ONLY_PATTERN" || true)
          if [ -n "$NON_DOCS" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Pure docs PR — skipping build setup."
          fi

      # GitHub is the state store: prior verdict + reviewed SHA come straight
      # from the PR's review list. No cross-run artifacts.
      #
      # BEFORE the guard, not after: the guard's `unchanged` short-circuit needs
      # `prior_head_sha` to compute the since-last delta, and skipping a run that
      # would re-review identical code is the single largest token saving in the
      # pipeline (PR 94: ~$35-40 across 7 full re-reviews). It also writes
      # /tmp/prior-reviews.json, which review-scan reads for the prior review body.
      #
      # `prior_head_sha` still matters on every run even when the gate itself
      # cannot fire: it is what scopes review-scan to the since-last delta. The
      # gate is suppressed for human-typed runs (GATE_HUMAN_REQUESTED below), so
      # under the on-demand trigger it protects only callers that wire an
      # automatic event; the ROUND-2 scoping is what saves the tokens there.
      - name: Derive prior review state
        id: prior_state
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BOT_USER: ${{ steps.review_identity.outputs.bot_user }}
        run: |
          set -uo pipefail
          STATE=$("$CLAUDE_REVIEW_SCRIPTS"/prior-review-state.sh)
          echo "Prior review state:"; echo "$STATE" | sed 's/^/  /'
          # No `-e` here (repo rule), and the step's last statement is an `if` —
          # so a failed derivation would set NO outputs and still go green,
          # handing the orchestrator an empty ROUND (that env has no `|| '1'`
          # fallback) and pinning the pipeline to round 1 with no error signal.
          # Fail loudly instead: an unknown round must never review as round 1.
          if ! grep -qE '^round=[0-9]+$' <<< "$STATE"; then
            echo "::error::prior-review-state.sh produced no usable state — refusing to run with an unknown round (would silently review as round 1)."
            exit 1
          fi
          grep -E '^(round|prior_head_sha|prior_verdict)=' <<< "$STATE" >> "$GITHUB_OUTPUT"

          # The findings themselves, not just the round number. prior-review-state.sh
          # gives review-scan the last review BODY — and the inline-XOR rule deleted
          # every critical and major from that body, so the body alone made the
          # highest-severity findings invisible to the next round. Never fatal: a
          # carrier that cannot be read contributes nothing.
          FSTATE=$(ROUND=$(sed -n 's/^round=//p' <<< "$STATE") "$CLAUDE_REVIEW_SCRIPTS"/prior-findings.sh)
          echo "Prior findings:"; echo "$FSTATE" | sed 's/^/  /'
          grep -E '^prior_finding_count=[0-9]+$' <<< "$FSTATE" >> "$GITHUB_OUTPUT" || true

      # The ONLY deterministic short-circuit left. No depth tiers — review-scan
      # self-scales — so this answers one question: does a model run at all?
      # Unit-tested in tests/guard_test.sh.
      - name: Guard
        id: guard
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMD_FUNCTIONAL: ${{ steps.cmd.outputs.run_functional }}
          # `/review deep` lifts the size ceiling for THIS run; the `deep-review`
          # label (GATE_FORCE_LABEL, read off the PR below) does it persistently.
          # Either one is enough — guard.sh gate 3.
          GATE_FORCE_DEEP: ${{ steps.cmd.outputs.force_deep }}
          GATE_TRIGGER: ${{ inputs.command_trigger }}
          GATE_FORCE_LABEL: ${{ inputs.gate_deep_label }}
          GATE_SKIP_LABEL: ${{ inputs.gate_skip_label }}
          GATE_SIZE_CEILING: ${{ inputs.gate_size_ceiling }}
          GATE_FILE_CEILING: ${{ inputs.gate_file_ceiling }}
          GATE_GENERATED_GLOBS: ${{ inputs.gate_generated_globs }}
          GATE_PRIOR_HEAD_SHA: ${{ steps.prior_state.outputs.prior_head_sha }}
          # A person typed this. The `unchanged` gate suppresses automatic
          # re-runs of identical code; it must never answer an explicit request
          # with silence (guard.sh, gate 2).
          GATE_HUMAN_REQUESTED: ${{ github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files,labels)
          GATE_FILES_TSV=$(jq -r '.files[] | "\(.path)\t\(.additions)\t\(.deletions)"' <<< "$PR_JSON")
          GATE_LABELS=$(jq -r '.labels[].name' <<< "$PR_JSON")
          # The since-last delta is computed HERE so guard.sh stays a pure function
          # of its env (no git, no network — tests/guard_test.sh asserts both). The
          # checkout is a full clone precisely so this always resolves.
          #
          # A FAILED diff clears the prior SHA rather than yielding an empty delta:
          # those two look identical to guard.sh and mean opposite things ("nothing
          # changed, skip" vs "I could not tell, so review everything"). Clearing it
          # is what makes the failure mode a full review instead of silence, and it
          # is re-exported as this step's `prior_head_sha` so review-scan scopes
          # itself off the SAME value the guard actually resolved.
          GATE_DELTA_FILES=""
          if [ -n "${GATE_PRIOR_HEAD_SHA:-}" ]; then
            if ! GATE_DELTA_FILES=$(git diff --name-only "${GATE_PRIOR_HEAD_SHA}..HEAD" 2>/dev/null); then
              echo "::warning::Could not diff ${GATE_PRIOR_HEAD_SHA}..HEAD — reviewing the whole PR instead of the delta."
              GATE_PRIOR_HEAD_SHA=""
            fi
          fi
          echo "prior_head_sha=$GATE_PRIOR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          export GATE_FILES_TSV GATE_LABELS GATE_DELTA_FILES GATE_PRIOR_HEAD_SHA
          DECISION=$("$CLAUDE_REVIEW_SCRIPTS"/guard.sh)
          echo "Guard:"; echo "$DECISION" | sed 's/^/  /'
          # No `-e` (repo rule): a failed guard would leave `proceed` empty, skip
          # everything below and go green having reviewed nothing.
          if ! grep -qE '^proceed=(true|false)$' <<< "$DECISION"; then
            echo "::error::guard.sh produced no usable decision — refusing to guess whether this PR should be reviewed."
            exit 1
          fi
          printf '%s\n' "$DECISION" >> "$GITHUB_OUTPUT"
          PROCEED=$(grep '^proceed=' <<< "$DECISION" | cut -d= -f2)
          VERDICT=$(grep '^verdict=' <<< "$DECISION" | cut -d= -f2)

          # The oversized gate posts its own REQUEST_CHANGES with NO model call:
          # guard.sh already rendered the split request, so write the poster's
          # artifact here and let the review step skip entirely.
          if [ "$PROCEED" != "true" ] && [ -n "$VERDICT" ]; then
            awk '/^body<<GUARD_BODY$/{f=1;next} /^GUARD_BODY$/{f=0} f' <<< "$DECISION" > /tmp/guard-body.md
            jq -n --arg v "$VERDICT" --rawfile b /tmp/guard-body.md \
              '{verdict: $v, body: $b, comments: [], meta: {findings: [], human_review: [], gate: "oversized"}}' \
              > /tmp/review.json
            echo "post=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No model call — posting the guard's split request."
          elif [ "$PROCEED" != "true" ]; then
            echo "post=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to review; nothing posted."
          else
            echo "post=true" >> "$GITHUB_OUTPUT"
          fi

          # The browser stack and the dev-env bring-up are the expensive half of a
          # review, so they cost nothing unless somebody typed `/review functional`
          # AND there is something to review.
          if [ "${CMD_FUNCTIONAL:-false}" = "true" ] && [ "$PROCEED" = "true" ]; then
            echo "functional=true" >> "$GITHUB_OUTPUT"
          else
            echo "functional=false" >> "$GITHUB_OUTPUT"
            if [ "${CMD_FUNCTIONAL:-false}" = "true" ]; then
              echo "::notice::Functional testing was requested but the guard short-circuited this PR — no agents run, so there is nothing to exercise."
            fi
          fi

      # Node and pnpm exist only for the dev-env bring-up, so they follow the same
      # gate as the rest of it: nothing installs unless a functional run is on.
      - name: Set up Node
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.guard.outputs.functional == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      - name: Ensure pnpm on PATH
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.guard.outputs.functional == 'true'
        shell: bash
        run: |
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm already present: $(pnpm --version)"
          elif corepack enable pnpm 2>/dev/null && command -v pnpm >/dev/null 2>&1; then
            echo "pnpm via corepack: $(pnpm --version)"
          else
            npm install -g pnpm
            echo "pnpm via npm: $(pnpm --version)"
          fi

      # Restore-only, like the package store below. The review job runs on
      # `issue_comment`, which has READ-ONLY access to the default branch's cache
      # scope — the all-in-one action's post(save) was refused on every
      # comment-triggered review and reported as a warning nobody read. The `id:`
      # is kept although nothing reads its outputs: the install step below is
      # written to be correct on a hit and a miss alike.
      # Image G bakes the pinned agent-browser AND runs `agent-browser install`,
      # so the binary and its Chrome for Testing are already on disk at
      # ~/.agent-browser — deliberately outside the scale set's scratch .cache
      # mount. Restoring the cache on top of that downloads ~340 MiB to land
      # bytes that are already there, and costs a cache entry against the repo's
      # 10 GB budget that evicts things nothing bakes. Probe first.
      #
      # Cheap on purpose: a version check plus the browsers dir. `doctor` would
      # launch Chrome, which the preflight already does once, properly.
      - name: Probe for a prebaked browser stack
        id: ab_baked
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.guard.outputs.functional == 'true'
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          baked=false
          if command -v agent-browser >/dev/null 2>&1 \
            && [ "$(agent-browser --version 2>/dev/null | awk '{print $2}')" = "${AGENT_BROWSER_VERSION}" ] \
            && [ -d "$HOME/.agent-browser/browsers" ] \
            && [ -n "$(ls -A "$HOME/.agent-browser/browsers" 2>/dev/null)" ]; then
            baked=true
          fi
          echo "baked=${baked}" >> "$GITHUB_OUTPUT"
          echo "prebaked browser stack: ${baked}"

      - name: Restore browser assets
        id: ab_cache
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.guard.outputs.functional == 'true' && steps.ab_baked.outputs.baked != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # agent-browser keeps browsers, daemon sockets and state under
          # ~/.agent-browser — deliberately NOT under ~/.cache, which the
          # panenco-claude-review scale set masks with a scratch emptyDir. The
          # cache path and the path agent-browser actually looks in are the same
          # directory, so a restore here is a restore the browser will see.
          path: |
            ~/.agent-browser/browsers
            ~/.local/bin/agent-browser
          key: ${{ runner.os }}-${{ runner.arch }}-ab-${{ env.AGENT_BROWSER_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ab-

      - name: Install agent-browser
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.guard.outputs.functional == 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/screenshots "$HOME/.local/bin"
          # ~/.local/bin is NOT on PATH on the fleet image (the Claude CLI lives
          # there behind an explicit probe, not a PATH lookup) — put it on PATH
          # for every later step, whether we installed the binary or the image
          # baked it.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          # The npm package is a fat tarball carrying a prebuilt static binary per
          # platform. We extract ONLY the linux-x64 one and skip the JS launcher
          # shim entirely, so nothing here needs Node (the package's
          # `engines: node>=24` gates only that shim). The fleet is amd64
          # throughout — GKE nodes are amd64 and image G hardcodes the /x64
          # toolcache path. Chrome for Testing publishes no linux-arm64 build, so
          # an arm64 runner would need a system Chromium via --executable-path.
          if command -v agent-browser >/dev/null 2>&1 \
            && [ "$(agent-browser --version 2>/dev/null | awk '{print $2}')" = "${AGENT_BROWSER_VERSION}" ]; then
            echo "agent-browser ${AGENT_BROWSER_VERSION} already present (prebaked or cache-restored)."
          else
            ABTMP="$(mktemp -d)"
            if curl -fsSL "https://registry.npmjs.org/agent-browser/-/agent-browser-${AGENT_BROWSER_VERSION}.tgz" \
                 | tar xz -C "$ABTMP" package/bin/agent-browser-linux-x64 \
               && install -m755 "$ABTMP/package/bin/agent-browser-linux-x64" "$HOME/.local/bin/agent-browser"; then
              echo "Installed agent-browser ${AGENT_BROWSER_VERSION}."
            else
              echo "::warning::Could not install agent-browser ${AGENT_BROWSER_VERSION}. The functional tester will CRASH-degrade; the review continues."
            fi
            rm -rf "$ABTMP"
          fi

          # Downloads Chrome for Testing into ~/.agent-browser/browsers. Needs no
          # root: unlike the chrome CHANNEL this replaces (a system apt install to
          # /opt/google/chrome), this is a plain unpack into $HOME. Idempotent —
          # ~0.15s no-op when the image baked it or the cache restored it. The
          # download comes from storage.googleapis.com, which the cluster reaches
          # over Private Google Access rather than the NAT path.
          #
          # `--with-deps` is deliberately NOT passed: it apt-installs Chrome's
          # shared libs and needs root, and image G already inherits them from
          # image B's `playwright install --with-deps`. A runner that lacks them
          # fails the preflight below rather than silently degrading.
          agent-browser install 2>&1 | tail -3 || \
            echo "::warning::agent-browser install failed — the preflight below will report what is missing."

      # Preflight the EXACT path the functional tester takes: does a real headless
      # Chrome launch on this runner? Today's equivalent failure is discovered six
      # turns into the subagent, after the budget is spent; this discovers it here.
      # Non-fatal on purpose — matches the old chrome-channel step's posture: the
      # tester CRASH-degrades and the review still posts.
      - name: Preflight browser
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.guard.outputs.functional == 'true'
        shell: bash
        run: |
          set -uo pipefail
          DOC="$(agent-browser doctor --json 2>/dev/null)" || DOC=""
          if [ -z "$DOC" ]; then
            echo "::warning::agent-browser doctor produced no output — functional testing may CRASH-degrade."
            exit 0
          fi
          FAILED="$(printf '%s' "$DOC" | jq -r '
            [.checks[] | select(.id == "chrome.installed" or .id == "launch.elapsed")
                       | select(.status != "pass") | "\(.id): \(.message)"] | join("; ")')"
          if [ -n "$FAILED" ]; then
            # Chrome's sandbox is the usual container-side culprit. The pod does
            # support it (image G's build-time assertion disables it only because
            # buildkit does not), so this is a fallback, not the default.
            echo "Launch preflight failed ($FAILED) — retrying with --no-sandbox."
            export AGENT_BROWSER_ARGS="--no-sandbox,--disable-dev-shm-usage"
            if agent-browser open about:blank >/dev/null 2>&1; then
              echo "AGENT_BROWSER_ARGS=--no-sandbox,--disable-dev-shm-usage" >> "$GITHUB_ENV"
              agent-browser close --all >/dev/null 2>&1 || true
              echo "Browser ready with --no-sandbox."
            else
              echo "::warning::agent-browser cannot launch Chrome on this runner ($FAILED). The functional tester will report CRASH; the review continues."
            fi
          else
            echo "Browser ready: $(printf '%s' "$DOC" | jq -r '.checks[] | select(.id == "chrome.installed") | .message')"
          fi

      # Late on purpose: the token picker needs the CLI before claude-code-action
      # installs it, and nothing earlier uses either.
      - name: Install Claude CLI (for OAuth token picker)
        id: claude_cli
        if: steps.cmd.outputs.proceed == 'true' && steps.guard.outputs.proceed == 'true'
        shell: bash
        run: |
          # Self-heal a root-owned ~/.local (a root-run step that inherited $HOME, or a
          # runner image that ships one) — the installer only surfaces it as EACCES.
          mkdir -p "$HOME/.local/share" 2>/dev/null || true
          [ -w "$HOME/.local/share" ] || sudo -n chown -R "$(id -u):$(id -g)" "$HOME/.local" 2>/dev/null || true
          if [ -x "$HOME/.local/bin/claude" ]; then
            echo "Claude CLI already installed: $("$HOME/.local/bin/claude" --version)"
          else
            curl -fsSL https://claude.ai/install.sh | bash
            "$HOME/.local/bin/claude" --version
          fi
          # Hand this exact binary to claude-code-action below so it does not fetch a
          # SECOND copy. Its base-action installs unconditionally otherwise:
          #   CLAUDE_CODE_VERSION="2.1.175"
          #   curl -fsSL https://claude.ai/install.sh | bash -s -- $CLAUDE_CODE_VERSION
          # which is ~500MB/job from downloads.claude.ai and was, when measured on the
          # Panenco fleet on 2026-08-12, 5.7% of ALL inbound bytes and the single
          # largest source on the Cloud NAT meter (github-action-runners#96).
          #
          # This is NOT what DISABLE_AUTOUPDATER covers. That switches off the CLI's
          # own updater; this download is an explicit install step in the action, and
          # it ran on every review even though the self-hosted image bakes the CLI.
          #
          # Emitted only when the binary is really there, so a failure upstream leaves
          # the input empty and the action falls back to installing for itself.
          if [ -x "$HOME/.local/bin/claude" ]; then
            echo "path=$HOME/.local/bin/claude" >> "$GITHUB_OUTPUT"
          fi
          # Hand the baked Bun to claude-code-action. It installs one via
          # `oven-sh/setup-bun` unless given `path_to_bun_executable`, which fetches a
          # release tarball from GitHub every job; objects.githubusercontent.com was
          # ~11% of the fleet's metered Cloud NAT bytes (github-action-runners#96).
          # Sampling after the bake shipped showed setup-bun's tool-cache restore
          # landing on only ~64% of jobs, so 4 in 11 still pulled bun-linux-x64.zip
          # despite the binary being present — this makes it deterministic.
          #
          # NO version-skew risk, unlike the CLI handover in #86: the image bakes
          # exactly the version the action's own `bun-version:` pins, which is why
          # BUN_VERSION is pinned in versions.env rather than tracking latest.
          #
          # Emitted only when the binary is really there. The action does NOT stat
          # this path — a wrong value is fail-CLOSED — so on any runner without the
          # bake (ubuntu-latest, an older image) the output stays unset, the input
          # resolves empty, and the action runs setup-bun exactly as it does today.
          if [ -x "$HOME/.local/bin/bun" ]; then
            echo "bun=$HOME/.local/bin/bun" >> "$GITHUB_OUTPUT"
            echo "Baked Bun: $("$HOME/.local/bin/bun" --version)"
          fi

      - name: Pick Claude OAuth token
        id: token_picker
        if: steps.cmd.outputs.proceed == 'true' && steps.guard.outputs.proceed == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
        run: |
          "$CLAUDE_REVIEW_SCRIPTS"/pick-oauth-token.sh

      # Restore-only on purpose: the all-in-one cache's post(save) step re-runs
      # hashFiles after dev-start.sh mutates the tree, errors, and reds the
      # check. warm-cache.yml is the saver.
      - name: Restore package-manager store
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.guard.outputs.functional == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-pkg-store-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pkg-store-

      # A heavy dev-start.sh can ENOSPC the post steps and lose a complete
      # review; reclaim tooling no app bring-up needs.
      - name: Free up runner disk
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.guard.outputs.functional == 'true' && inputs.free_disk_space != 'off'
        shell: bash
        env:
          FREE_MODE: ${{ inputs.free_disk_space }}
        run: |
          set -uo pipefail
          echo "Disk before:"; df -h / | tail -1
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup /usr/share/swift 2>/dev/null || true
          if [ "${FREE_MODE}" = "aggressive" ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet 2>/dev/null || true
            docker image prune -af >/dev/null 2>&1 || true
          fi
          echo "Disk after:"; df -h / | tail -1

      # This fleet reuses runners and /tmp survives between jobs, so a previous
      # review's /tmp/dev-env would make the orchestrator wait for — and then
      # trust — a dev-env that belongs to another PR. Runs whenever the review
      # proceeds, and BEFORE the conditional pre-start below, which is what makes
      # "no /tmp/dev-env/started" mean "no bring-up on THIS run".
      - name: Clear stale dev-env state
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        run: rm -rf /tmp/dev-env

      # Generic, opt-in dev build/dependency cache (the dev_cache_* inputs).
      # The key is computed HERE (not passed in) because a reusable-workflow
      # caller's `with:` has no runner/checkout, so it can't use runner/hashFiles
      # — this job does. Restore-ONLY here — after disk cleanup, before the
      # bring-up — so dev-start.sh compiles/installs against a warm cache instead
      # of cold every run. The matching warm/save lives in warm-cache.yml, which
      # a write-capable trigger drives; exactly like the package store, warming
      # in the default-branch scope makes the
      # cache available to every PR, not just re-pushes of the same branch.
      # restore (not the all-in-one cache action) so dev-start.sh mutating the
      # tree can't trigger an all-in-one post(save) re-hash that reds the run.
      - name: Compute dev cache key
        id: dev_cache_meta
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.guard.outputs.functional == 'true' && inputs.dev_cache_paths != '' && inputs.dev_cache_key_files != ''
        shell: bash
        env:
          KEY_FILES: ${{ inputs.dev_cache_key_files }}
          KEY_PREFIX: ${{ inputs.dev_cache_key_prefix }}
        run: |
          shopt -s globstar nullglob
          files=()
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            # shellcheck disable=SC2206  # intentional glob + word-split of the pattern
            for f in $pat; do [ -f "$f" ] && files+=( "$f" ); done
          done <<< "$KEY_FILES"
          if [ ${#files[@]} -eq 0 ]; then
            hash="nofiles"
          else
            hash=$(printf '%s\0' "${files[@]}" | sort -zu | xargs -0 sha256sum | sha256sum | cut -c1-16)
          fi
          echo "key=${RUNNER_OS}-${RUNNER_ARCH}-${KEY_PREFIX}-${hash}" >> "$GITHUB_OUTPUT"
          echo "restore=${RUNNER_OS}-${RUNNER_ARCH}-${KEY_PREFIX}-" >> "$GITHUB_OUTPUT"
      - name: Restore dev build cache
        id: dev_build_cache
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.guard.outputs.functional == 'true' && inputs.dev_cache_paths != '' && inputs.dev_cache_key_files != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.dev_cache_paths }}
          key: ${{ steps.dev_cache_meta.outputs.key }}
          restore-keys: ${{ steps.dev_cache_meta.outputs.restore }}

      # Detached (setsid/nohup/disown) so the bring-up survives the step
      # boundary; the orchestrator polls /tmp/dev-env/rc + outputs.
      - name: Pre-start dev environment (background)
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.guard.outputs.functional == 'true'
        id: dev_env_bg
        shell: bash
        env:
          DEV_ENV_SECRETS: ${{ secrets.DEV_ENV_SECRETS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/dev-env
          : > /tmp/dev-env/outputs
          : > /tmp/dev-env/log
          rm -f /tmp/dev-env/rc
          # THE MARKER THE ORCHESTRATOR GATES ITS WAIT ON. This step is
          # conditional; the orchestrator's turn-1 wait for /tmp/dev-env/rc used
          # to be unconditional, so on every code-only review it blocked for the
          # full dev_env_timeout_seconds on a file nothing would ever write
          # (~600s, about half the job's wall clock). Written BEFORE the launch,
          # so the marker can never be newer than the bring-up it promises. The
          # "Clear stale dev-env state" step above guarantees its absence means
          # "no bring-up this run" even on a reused runner.
          date +%s > /tmp/dev-env/started
          setsid nohup bash -c '
            GITHUB_OUTPUT=/tmp/dev-env/outputs "$CLAUDE_REVIEW_SCRIPTS"/setup-dev-env.sh
            echo $? > /tmp/dev-env/rc
          ' > /tmp/dev-env/log 2>&1 < /dev/null &
          PID=$!
          disown "$PID"
          echo "$PID" > /tmp/dev-env/pid
          echo "Background dev-env launched: PID=$PID (process group leader)"

      # ── THE SECOND OPINION, NOW PINNED. (`/review native`, opt-in.) ──
      #
      # Installs Anthropic's OFFICIAL `code-review` plugin so the `review-native`
      # subagent can read their rubric at runtime and follow it verbatim. We still
      # do not vendor a paraphrase of that prompt: we vendor the REPOSITORY it
      # lives in, at ONE COMMIT, and read the installed file from there.
      #
      # WHY THIS BLOCK EXISTS. `plugin_marketplaces` used to be handed the live URL
      # `https://github.com/anthropics/claude-plugins-public.git` — the only
      # third-party reference in this file that was not SHA-pinned, and the reason
      # the pass was deleted outright rather than kept (ADR 0004, bugbot.md). It is
      # pinned now. The mechanism is a LOCAL-PATH marketplace, which sidesteps every
      # limit the old comment correctly documented about the URL form:
      #
      #   * `actions/checkout` takes `repository:` + `ref:`, and `ref:` accepts a
      #     full commit SHA. THAT is the pin — the same mechanism as every other
      #     third-party pin in this file, not a weaker substitute for one.
      #   * claude-code-action accepts a PATH here, not only a URL. Verified in its
      #     `base-action/src/install-plugins.ts` at the SHA this workflow already
      #     pins (ac7e24bf): `isLocalPath()` returns true for `/`, `./` and `../`,
      #     and `validateMarketplaceInput()` then returns EARLY — "Local paths are
      #     passed directly to Claude Code which handles them" — skipping the
      #     `MARKETPLACE_URL_REGEX` that rejected `...public.git#<ref>`.
      #   * `claude plugin marketplace add --help` (CLI 2.1.251): "Add a marketplace
      #     from a URL, path, or GitHub repo". A directory source is first-class and
      #     is recorded in settings.json as `{"source":"directory","path":…}`.
      #
      # NOTHING IS FETCHED FROM A MOVING REF AT REVIEW TIME. The sparse checkout is
      # the only network call, and `code-review`'s catalog entry is
      # `"source": "./plugins/code-review"` — a path INSIDE the repo we just pinned
      # — so the prompt that runs is exactly the prompt at that SHA. No sibling
      # plugin's third-party `git-subdir` source is ever resolved: the rewritten
      # catalog below lists this one plugin and nothing else.
      #
      # ADVISORY, AND IT FAILS SOFT. Both steps are `continue-on-error` and the
      # action inputs below are gated on `native_plugin.outputs.ready`. A second
      # opinion that cannot be obtained must never cost the PR its review.
      #
      # BUMPING THE PIN is an ordinary dependency bump: change the SHA, re-run.
      - name: "Native pass: vendor the plugin marketplace at a pinned SHA"
        id: native_checkout
        if: steps.cmd.outputs.proceed == 'true' && steps.guard.outputs.proceed == 'true' && steps.cmd.outputs.run_native == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-plugins-public
          # THE PIN. That repo publishes no tags and no releases, so a full commit
          # SHA is the only fixed point available — and it is the strongest one.
          ref: ed404106fcd80ba98ecb7c851e531dcb626d13b7
          path: __claude-plugins-marketplace
          # This tree is third-party code we are about to feed to a model. It has
          # no business carrying a credential that can write to this repo.
          persist-credentials: false
          # The repo is ~10 MB of other vendors' plugins. Take the catalog and the
          # one plugin; leave the rest on the server.
          sparse-checkout: |
            .claude-plugin
            plugins/code-review

      # The upstream catalog cannot be used as-is from a directory source: the CLI
      # RESERVES its name. Verified against CLI 2.1.251 — keeping `name:
      # "claude-plugins-official"` fails with "The name ... is reserved for official
      # Anthropic marketplaces and can only be used with GitHub sources from the
      # 'anthropics' organization", and any lookalike name fails with "Marketplace
      # name impersonates an official Anthropic/Claude marketplace". So the CATALOG
      # is renamed and cut to one entry. The PLUGIN's own files are never touched —
      # only the index that points at them.
      - name: "Native pass: rewrite the vendored catalog to the one pinned plugin"
        id: native_plugin
        if: steps.cmd.outputs.proceed == 'true' && steps.guard.outputs.proceed == 'true' && steps.cmd.outputs.run_native == 'true' && steps.native_checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          MKT: ${{ github.workspace }}/__claude-plugins-marketplace
        run: |
          set -uo pipefail
          CMD="$MKT/plugins/code-review/commands/code-review.md"
          if [ ! -s "$CMD" ]; then
            echo "::warning::native pass: $CMD is missing at the pinned SHA — skipping the second opinion."
            exit 0
          fi
          SRC="$MKT/.claude-plugin/marketplace.json"
          # Single-quoted so the shell leaves `$schema` alone; jq reads it as a
          # plain string key, not a variable.
          if ! jq '{
                 "$schema": .["$schema"],
                 name: "pinned-upstream-review",
                 description: "Vendored copy of anthropics/claude-plugins-public, pinned by checkout SHA and cut down to the single plugin this pipeline installs.",
                 owner: { name: "anthropics/claude-plugins-public, vendored at a pinned commit" },
                 plugins: [ .plugins[] | select(.name == "code-review") ]
               }' "$SRC" > "$SRC.tmp"; then
            echo "::warning::native pass: could not rewrite the vendored catalog — skipping the second opinion."
            exit 0
          fi
          if [ "$(jq '.plugins | length' "$SRC.tmp" 2>/dev/null)" != "1" ]; then
            echo "::warning::native pass: the pinned catalog has no code-review entry — skipping the second opinion."
            exit 0
          fi
          mv "$SRC.tmp" "$SRC"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Native pass ready at $(git -C "$MKT" rev-parse HEAD) ($(wc -c < "$CMD") bytes of upstream prompt)"

      # User scope is REQUIRED for BOTH files: claude-code-action's restore-config
      # wipes the workspace .claude/ on PR-head jobs; $HOME survives. Each file only
      # pins its subagent's model and points at its skill. The tester needs no MCP
      # server — the browser is a CLI the subagent drives through Bash.
      - name: Install review subagents
        if: steps.cmd.outputs.proceed == 'true' && steps.guard.outputs.proceed == 'true'
        shell: bash
        env:
          MODEL_HIGH: ${{ inputs.model_high }}
          MODEL_FUNCTIONAL: ${{ inputs.model_functional }}
          MODEL_STANDARD: ${{ inputs.model_standard }}
          NATIVE_READY: ${{ steps.native_plugin.outputs.ready }}
        run: |
          mkdir -p "$HOME/.claude/agents"
          # The two stages of the review itself. Their depth is frontmatter, not a
          # workflow input: review-scan runs `effort: medium`, review-verify
          # `effort: low` (its mandate is to refute, not to explore).
          for a in review-scan review-verify; do
            envsubst '$MODEL_HIGH $CLAUDE_REVIEW_PIPELINE_DIR' \
              < "$CLAUDE_REVIEW_PIPELINE_DIR/agents/${a}.md" \
              > "$HOME/.claude/agents/${a}.md"
            echo "Installed $a subagent (model=$MODEL_HIGH)"
          done
          envsubst '$MODEL_FUNCTIONAL $CLAUDE_REVIEW_PIPELINE_DIR' \
            < "$CLAUDE_REVIEW_PIPELINE_DIR/agents/review-functional-tester.md" \
            > "$HOME/.claude/agents/review-functional-tester.md"
          echo "Installed review-functional-tester subagent (model=$MODEL_FUNCTIONAL)"
          # Only when the pinned marketplace actually resolved. Installing the
          # subagent without the plugin behind it would give the orchestrator a
          # dispatch target that can only ever report `unavailable`.
          if [ "${NATIVE_READY:-}" = "true" ]; then
            envsubst '$MODEL_STANDARD $CLAUDE_REVIEW_PIPELINE_DIR' \
              < "$CLAUDE_REVIEW_PIPELINE_DIR/agents/review-native.md" \
              > "$HOME/.claude/agents/review-native.md"
            echo "Installed review-native subagent (model=$MODEL_STANDARD)"
          else
            rm -f "$HOME/.claude/agents/review-native.md"
            echo "Native pass not enabled for this run — review-native subagent not installed"
          fi

      # Single top-level agent; all subagents dispatch via Task inside this
      # one invocation. continue-on-error: a max-turns exit may still have
      # written /tmp/review.json — the poster decides from the artifact.
      # Register the Stop hook that ENFORCES "always write /tmp/review.json".
      # The orchestrator skill and the prompt below both already ask for it; on
      # 2026-08-12 asking stopped working (the CLI gained backgrounded agents and
      # the orchestrator yielded with a prose-only turn, ending the session with
      # no artifact). scripts/require-review-json.sh refuses that stop.
      #
      # USER SCOPE, NOT THE WORKSPACE, and that is load-bearing twice over:
      # claude-code-action restores `.claude/` for untrusted PR heads and would
      # wipe a workspace-local hook (the same reason action.yml keeps skills in
      # the action dir), and `--setting-sources user` below is precisely what
      # makes ~/.claude/settings.json the scope that gets read.
      #
      # MERGED, never overwritten: the image may ship its own user settings, and
      # clobbering them would be an invisible regression in something unrelated.
      # MUST stay gated on the guard: this step deletes /tmp/review.json, and on the
      # oversized path the guard has already written the split request there.
      - name: Enforce review.json on session end
        id: stop_hook
        if: steps.cmd.outputs.proceed == 'true' && steps.guard.outputs.proceed == 'true'
        shell: bash
        env:
          HOOK: ${{ env.CLAUDE_REVIEW_PIPELINE_DIR }}/scripts/require-review-json.sh
        run: |
          set -uo pipefail
          if [ ! -f "$HOOK" ]; then
            echo "::error::stop hook missing at $HOOK — pipeline install is incomplete"
            exit 1
          fi
          chmod +x "$HOOK" 2>/dev/null || true
          # A stale counter from a previous run on a reused runner would spend
          # this review's nudge budget before it starts. The stage artifacts go with
          # it, and that is not cosmetic: this fleet reuses runners and /tmp survives
          # between jobs, so a leftover scan/verify from a previous PR would be read
          # as this one's.
          rm -f /tmp/review-stop-blocks /tmp/review.json \
                /tmp/scan.json /tmp/verify.json /tmp/functional.json /tmp/native.json 2>/dev/null || true
          mkdir -p "$HOME/.claude"
          S="$HOME/.claude/settings.json"
          [ -s "$S" ] || echo '{}' > "$S"
          if ! jq -e 'type == "object"' "$S" >/dev/null 2>&1; then
            echo "::warning::$S was not a JSON object; replacing it with the hook config only"
            echo '{}' > "$S"
          fi
          # APPEND to whatever Stop hooks are already there — a plain assignment
          # would silently drop the image's own, which is what the comment above
          # promises never happens. A stale copy of OUR command is dropped first,
          # so re-registering on a reused runner cannot stack duplicates.
          # Extracted verbatim by tests/require_review_json_test.sh; keep the
          # STOP_HOOK_JQ='...' delimiters on their own lines.
          STOP_HOOK_JQ='
            def stop_entries: if (.hooks.Stop? | type) == "array" then .hooks.Stop else [] end;
            .hooks = (if (.hooks? | type) == "object" then .hooks else {} end)
            | .hooks.Stop = (stop_entries
                | map(select([.hooks[]?.command] | index($cmd) | not))
                + [{"hooks": [{"type": "command", "command": $cmd}]}])
          '
          jq --arg cmd "$HOOK" "$STOP_HOOK_JQ" \
            "$S" > "$S.tmp" && mv "$S.tmp" "$S" || {
              echo "::error::failed to register the Stop hook in $S"; exit 1; }
          echo "Stop hook registered: $HOOK"
          jq -c '.hooks' "$S"

      - name: "Review: orchestrate"
        id: claude_run
        if: steps.cmd.outputs.proceed == 'true' && steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@ac7e24bf2938964b8ab203e417a2773802392ddd # v1.0.146
        env:
          REVIEW_BOT_USER: ${{ steps.review_identity.outputs.bot_user }}
          # From the GUARD, not prior_state: the guard clears it when the
          # since-last diff could not be computed, and review-scan must scope
          # itself off the value that was actually resolvable.
          PRIOR_HEAD_SHA: ${{ steps.guard.outputs.prior_head_sha }}
          PRIOR_VERDICT: ${{ steps.prior_state.outputs.prior_verdict }}
          ROUND: ${{ steps.prior_state.outputs.round }}
          PR_AUTHOR_IS_BOT: ${{ steps.pr_sha.outputs.author_is_bot }}
          DEV_ENV_TIMEOUT_SECONDS: ${{ inputs.dev_env_timeout_seconds }}
          DEV_ENV_SECRETS: ${{ secrets.DEV_ENV_SECRETS }}
          # Read by scripts/build-spec.sh in the orchestrator's turn 1, which
          # exports each KEY=VALUE line for the consumer's fetch-issue.sh hook.
          TRACKER_SECRETS: ${{ secrets.TRACKER_SECRETS }}
          # Separate token for the review-assets branch (a custom App token
          # may lack contents: write).
          GITHUB_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_HIGH: ${{ inputs.model_high }}
          MODEL_FUNCTIONAL: ${{ inputs.model_functional }}
          FUNCTIONAL_BUDGET_SECONDS: ${{ inputs.functional_budget_seconds }}
          # Forces every capture into the one directory the orchestrator
          # publishes from, so a bare `agent-browser screenshot` cannot drop
          # a PNG in the CWD and vanish from the gallery.
          AGENT_BROWSER_SCREENSHOT_DIR: /tmp/screenshots
          # The same value the dev-env and browser steps gated on, so the tester can
          # never land in an unbuilt environment.
          RUN_FUNCTIONAL: ${{ steps.guard.outputs.functional }}
          DOCS_ONLY: ${{ steps.guard.outputs.docs_only }}
          # How many human-review items this diff is worth (3–8, from diff size).
          # review-scan caps itself at it; review-verify moves it ±1 on the
          # review_effort scan reported. Empty on any short-circuited path, where
          # both skills fall back to 5 — the old flat constant.
          REVIEW_DEPTH_SCALE: ${{ steps.guard.outputs.depth_scale }}
          # The orchestrator's gate for the second opinion. TRUE only when the
          # comment asked for it AND the pinned marketplace resolved, so the
          # orchestrator never dispatches a subagent that was not installed.
          RUN_NATIVE: ${{ steps.native_plugin.outputs.ready == 'true' && steps.cmd.outputs.run_native == 'true' }}
          NATIVE_REVIEW_SCOPE: ${{ inputs.native_review_scope }}
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.review_identity.outputs.token }}
          # The SHA-PINNED second opinion — see the two "Native pass:" steps above
          # for the full rationale and the verification behind every claim in it.
          # A LOCAL PATH, never a URL: that is what makes it pinnable at all, and
          # it is why re-adding this input does not re-open the exposure that got
          # the pass deleted. Both are empty unless `/review native` (or `all`) was
          # asked for and the vendoring succeeded — and empty restores the action's
          # stock behaviour of installing nothing.
          plugin_marketplaces: ${{ steps.native_plugin.outputs.ready == 'true' && format('{0}/__claude-plugins-marketplace', github.workspace) || '' }}
          plugins: ${{ steps.native_plugin.outputs.ready == 'true' && 'code-review@pinned-upstream-review' || '' }}
          # Reuse the CLI the step above already guaranteed instead of letting the
          # action download its own pinned copy — see that step for the measurement.
          # Empty when that step was skipped, which restores the action's stock
          # behaviour rather than breaking it.
          path_to_claude_code_executable: ${{ steps.claude_cli.outputs.path }}
          prompt: |
            Read ${{ env.CLAUDE_REVIEW_PIPELINE_DIR }}/skills/review-orchestrator.md and follow it exactly. PR number: ${{ env.PR_NUMBER }}. You are the single top-level agent for this review and you do NOT review the diff yourself. Dispatch `review-scan` (Task tool, pre-installed subagent type) and then `review-verify`; both are pre-installed and carry their own model and effort. The functional tester is pre-installed as `review-functional-tester` and is ADVISORY ONLY — dispatch it in the same response as review-scan, and only when RUN_FUNCTIONAL=true, the dev-env is up, and a linked issue supplies real acceptance criteria. The second opinion is pre-installed as `review-native` (Anthropic's official `code-review` plugin, run in-session) and is likewise ADVISORY — dispatch it in that SAME response, and ONLY when RUN_NATIVE=true; it writes /tmp/native.json, which review-verify reads as extra candidates to refute, and it never posts anything. Copy review-verify's verdict, body and comments into /tmp/review.json VERBATIM — its `{{LINK:path:line}}` placeholders and its wording are deliberate and post-review.sh finishes them; do not rewrite, re-summarise or add sections. Your final artifact is /tmp/review.json — ALWAYS write it before exiting, even degraded. Never end a turn with prose only (no tool calls): that terminates the session and crashes the pipeline — every message must contain a tool call until review.json is written.
          # ── THE SANDBOX. `--disallowedTools` is the ONLY thing standing between
          # this job's write scopes and an untrusted prompt. ──
          #
          # This job holds `contents: write` + `pull-requests: write` +
          # `issues: write`, and every agent in it reads attacker-controlled PR
          # titles, bodies, diffs and comments. `gh pr review/edit/close`,
          # `gh issue comment` and raw API writes were all reachable before this
          # list was tightened.
          #
          # WHY IT CAN DENY THE RAW API SUBCOMMAND. `--disallowedTools` is
          # SESSION-WIDE: it cannot be scoped to one subagent, so it could not deny
          # the raw `gh` API verb while our own agents still used it. They no longer
          # do at all: the last call site was the screenshot upload, and
          # `scripts/upload-screenshots.sh` is now invoked by the poster (§ 2c of
          # post-review.sh) in its own step, after this session has exited. Nothing
          # inside the review session needs the raw API verb, so nothing legitimate
          # is caught and the deny needs no carve-out.
          #
          # WHAT STAYS REACHABLE, on purpose: `gh pr view/diff/list`,
          # `gh issue view`, `gh search`, `git log/blame/diff/show`. review-scan
          # reads the PR and its prior reviews that way, and review-verify re-reads
          # the source at HEAD. Denying those would break the review; denying the
          # write verbs does not.
          #
          # WHY THE `gh pr comment` ENTRY IS LOAD-BEARING SPECIFICALLY: this pipeline
          # posts exactly ONE review, and `scripts/post-review.sh` is the only thing
          # allowed to post it. The deny rule makes that STRUCTURAL rather than a
          # wording preference, so a stray post cannot bypass the
          # single-consolidated-comment contract even if some turn decides to try.
          #
          # MECHANICS, so nobody "simplifies" this: deny rules are evaluated BEFORE
          # allow rules and cannot be widened by anything downstream — not by a
          # subagent, not by an agent definition's `tools:` frontmatter — and
          # `--permission-mode dontAsk` is what makes the whole list BIND rather than
          # merely auto-approve (in Manual mode `--allowedTools` only AUTO-APPROVES
          # what it lists, and unlisted calls fall through to a `canUseTool` callback
          # claude-code-action never supplies).
          # `--effort low` because this session writes no review prose: it fans out
          # two subagents (which carry their own `effort:` frontmatter) and copies
          # one file. Verified present on the CLI as `--effort <low|medium|high>`.
          #
          # SAME REASON, THE MODEL. `model_orchestrator` (Sonnet), not
          # `model_high`: at Opus rates this plumbing measured 7-19% of a run's
          # spend ($0.30-0.67) for a Read, a Bash, some Task calls and a jq. It
          # does NOT cascade — `--model` sets this session only, and every
          # subagent's model comes from the `model:` frontmatter the "Install
          # review subagents" step envsubst'd from model_high/_functional/
          # _standard. Do not collapse these two inputs back into one.
          claude_args: |
            --model ${{ inputs.model_orchestrator }}
            --effort low
            --permission-mode dontAsk
            --setting-sources user
            --allowedTools Bash,Read,Write,Glob,Grep,Task,ToolSearch
            --disallowedTools "Edit,WebFetch,WebSearch,Bash(gh api:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr merge:*),Bash(gh pr ready:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh release:*),Bash(git push:*)"
            --max-turns 100
          show_full_output: "true"
          # Empty on any runner that does not bake Bun, which restores the action's
          # own setup-bun step rather than breaking it. See the probe above.
          path_to_bun_executable: ${{ steps.claude_cli.outputs.bun }}

      # The agent-browser daemon outlives the process that started it and idles
      # for an hour by default. This pod requests 8Gi and the pool is Spot: a
      # browser held past the review's end is exactly the saturation
      # `alert-scaleset-at-max-runners` reports. Always, never fatal.
      - name: Stop browser daemon
        if: always()
        shell: bash
        run: agent-browser close --all >/dev/null 2>&1 || true

      # This step's exit code IS the check: green = a review reached the PR
      # (REQUEST_CHANGES included — the blocking signal is the PR review, not
      # the check color), red = pipeline failure.
      # Runs for the guard's no-model split request too — `post` is true whenever
      # something must reach the PR, whether or not a model produced it.
      - name: Post review + gate
        id: post_review
        if: always() && steps.guard.outputs.post == 'true' && steps.claude_run.outcome != 'cancelled'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review_identity.outputs.token }}
          GITHUB_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BOT_USER: ${{ steps.review_identity.outputs.bot_user }}
          ANALYZER_OUTCOME: ${{ steps.claude_run.outcome }}
          HEAD_SHA: ${{ steps.pr_sha.outputs.sha }}
          ORCHESTRATOR_EXEC: ${{ steps.claude_run.outputs.execution_file }}
          ROUND: ${{ steps.prior_state.outputs.round || '1' }}
          # So the poster can say, in the review itself, that a requested
          # functional pass never ran because the dev-env did not come up.
          FUNCTIONAL_REQUESTED: ${{ steps.guard.outputs.functional }}
          # The same number the orchestrator waits on, so the poster can tell
          # "never came up" apart from "came up 40s after we stopped waiting" —
          # the second is a knob to turn, the first is a broken bring-up, and
          # before this they were both reported as neither.
          DEV_ENV_TIMEOUT_SECONDS: ${{ inputs.dev_env_timeout_seconds }}
          # The inline-comment cap, scaled with the diff (twice depth_scale, so
          # 6–16). Computed in guard.sh so post-review.sh keeps reading one env
          # var with one default; empty on a short-circuited run, where the
          # poster's own `:-10` applies and nothing is capped away.
          REVIEW_COMMENT_LIMIT: ${{ steps.guard.outputs.comment_limit }}
        run: |
          set -uo pipefail
          if [ -n "${ORCHESTRATOR_EXEC:-}" ] && [ -f "$ORCHESTRATOR_EXEC" ]; then
            cp "$ORCHESTRATOR_EXEC" /tmp/orchestrator-output.txt 2>/dev/null || true
          fi
          "$CLAUDE_REVIEW_SCRIPTS"/post-review.sh

      - name: Report usage
        if: always() && steps.guard.outputs.post == 'true' && steps.claude_run.outcome != 'cancelled'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr_sha.outputs.sha }}
          ANALYZER_OUTCOME: ${{ steps.claude_run.outcome }}
          POSTER_OUTCOME: ${{ steps.post_review.outcome }}
          ROUND: ${{ steps.prior_state.outputs.round || '1' }}
        run: |
          set +e
          COST=null; MODELS='[]'; WALL=null; R='{}'
          if [ -f /tmp/orchestrator-output.txt ]; then
            c=$(grep -oE '"total_cost_usd"[[:space:]]*:[[:space:]]*[0-9]+(\.[0-9]+)?' /tmp/orchestrator-output.txt 2>/dev/null \
                  | grep -oE '[0-9]+(\.[0-9]+)?$' | sort -g | tail -1)
            [ -n "$c" ] && COST="$c"
            m=$(grep -oE '"model"[[:space:]]*:[[:space:]]*"claude[^"]*"' /tmp/orchestrator-output.txt 2>/dev/null \
                  | grep -oE 'claude[^"]*' | sort -u | jq -R . | jq -s 'unique' 2>/dev/null)
            echo "$m" | jq -e 'type=="array"' >/dev/null 2>&1 && MODELS="$m"
          fi
          if [ -f /tmp/job-start ]; then
            s=$(cat /tmp/job-start) && WALL=$(( $(date +%s) - s ))
          fi
          [ -f /tmp/review.json ] && jq -e 'type=="object"' /tmp/review.json >/dev/null 2>&1 && R=$(cat /tmp/review.json)
          jq -n \
            --argjson r "$R" --argjson round "$ROUND" --argjson cost "$COST" \
            --argjson models "$MODELS" --argjson wall "$WALL" \
            --arg repo "$GITHUB_REPOSITORY" --arg pr "${PR_NUMBER:-}" \
            --arg run_id "$GITHUB_RUN_ID" --arg attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --arg head "${HEAD_SHA:-}" --arg analyzer "${ANALYZER_OUTCOME:-}" --arg poster "${POSTER_OUTCOME:-}" \
            '{schema_version: 1, repo: $repo, pr_number: ($pr | tonumber? // null),
              run_id: $run_id, run_attempt: ($attempt | tonumber? // 1), head_sha: $head,
              recorded_at: (now | todate), round: $round,
              verdict: ($r.verdict // null),
              findings_count: (($r.meta.findings // []) | length),
              posting_error: (if $poster == "success" then null else "poster outcome: \($poster)" end),
              human_review_count: (($r.meta.human_review // []) | length),
              depth_used: ($r.meta.depth_used // null),
              review_effort: ($r.meta.review_effort // null),
              functional_overall: ($r.meta.functional // null),
              gate: ($r.meta.gate // null),
              analyzer_outcome: $analyzer, poster_outcome: $poster,
              claude_cost_usd: $cost, models: $models,
              phases: (if $wall == null then {} else {total: $wall} end)
            }' > /tmp/usage.json
          echo "Wrote /tmp/usage.json:"; cat /tmp/usage.json
          exit 0

      - name: Upload usage record
        if: always() && steps.guard.outputs.post == 'true' && steps.claude_run.outcome != 'cancelled'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-usage
          path: /tmp/usage.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      # Gated on the same `post` as everything else: on a reused runner /tmp
      # still holds the previous job's review.json, and an ungated always()
      # uploaded that stale artifact for a run the guard short-circuited.
      - name: Upload review artifacts
        if: always() && steps.guard.outputs.post == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-${{ env.PR_NUMBER }}
          path: |
            /tmp/review.json
            /tmp/scan.json
            /tmp/verify.json
            /tmp/functional.json
            /tmp/native.json
            /tmp/screenshots/
            /tmp/orchestrator-output.txt
            /tmp/dev-env/log
          if-no-files-found: ignore
          retention-days: 7
