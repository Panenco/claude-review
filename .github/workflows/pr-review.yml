name: Claude PR Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number. Auto-detected from the triggering comment; pass it explicitly for `workflow_dispatch`."
        type: string
      command:
        description: "Review command, e.g. `/review code functional`. Leave empty on an `issue_comment` trigger — the workflow reads the comment body straight off the caller's event, which is why a caller needs no extra `with:` wiring for the common case. Set it only for `workflow_dispatch`, where there is no comment to read; an empty command there means a plain judge review, because clicking Run workflow IS the opt-in."
        type: string
        default: ""
      command_trigger:
        description: "Prefix that starts a review command. Change it only if `/review` collides with another bot in your repo — it is quoted verbatim in the menu the reviewer posts back."
        type: string
        default: "/review"
      runner:
        description: "Runner label for the review job. Pass the SAME value to warm-cache.yml. Defaults to the `panenco-claude-review` ARC scale set. Set `ubuntu-latest` to run on GitHub-hosted instead — REQUIRED for any repo that is not a member of the `claude-review` org runner group, because ARC fails closed: an unreachable label does not fall back, it queues for GitHub's 24h timeout and then fails. The review job and warm-cache.yml must share a fleet: cache keys are scoped by OS+arch, so a hosted warm could never produce an entry an arm64 fleet can restore. Your fleet needs egress to the Actions cache service, else every review runs cold."
        type: string
        default: "panenco-claude-review"
      model_high:
        description: "Deep-reasoning model (Opus judge)."
        type: string
        default: "claude-opus-5"
      model_standard:
        description: "Standard-tier model (orchestrator, context builder)."
        type: string
        default: "claude-sonnet-5"
      model_fast:
        description: "Cheap-tier model (Haiku judge)."
        type: string
        default: "claude-haiku-4-5"
      model_functional:
        description: "Model for the functional tester (drives a real browser via the agent-browser CLI over Bash)."
        type: string
        default: "claude-sonnet-5"
      pipeline_ref:
        description: "Ref of panenco/claude-review to install skills/scripts from. Pin to a SHA or branch when testing pipeline changes."
        type: string
        default: "v3"
      dev_env_timeout_seconds:
        description: "How long to wait for the background dev-env (.github/claude-review/dev-start.sh) to come up."
        type: number
        default: 360
      functional_budget_seconds:
        description: "Wall-clock budget for the functional tester."
        type: number
        default: 480
      free_disk_space:
        description: "Runner disk to reclaim before dev-env bring-up: safe (default) | aggressive | off."
        type: string
        default: "safe"
      native_review_scope:
        description: "Optional free-text path-scoping instruction injected verbatim into the `review-native` subagent's prompt, e.g. \"only review changes under `apps/api/` and `apps/web/`; ignore everything else\". Empty (default) reviews the whole diff. Ignored entirely unless the triggering comment asked for the native pass (`/review native`). Wire it on monorepos where much of a typical diff is generated, vendored or out of scope: Anthropic's plugin prompt knows nothing about this pipeline's gate rules and will otherwise spend its budget on paths nobody wants reviewed."
        type: string
        default: ""
      gate_skip_label:
        description: "Label that forces review_level=skip — an opt-out that outranks an explicit `/review` comment, so a repo can park a PR the bot must not touch."
        type: string
        default: "skip-review"
      gate_deep_label:
        description: "Label that forces review_level=full (skip wins if both present). `/review deep` does the same thing for one run, without leaving a label behind."
        type: string
        default: "deep-review"
      gate_small_ceiling:
        description: "Non-generated changed lines at/under which a runtime PR is `small`."
        type: number
        default: 300
      gate_tiny_ceiling:
        description: "Non-generated changed lines at/under which a runtime PR is `tiny` (single judge, functional skipped)."
        type: number
        default: 10
      gate_size_ceiling:
        description: "Non-generated changed lines over which a PR is `oversized`."
        type: number
        default: 3000
      gate_file_ceiling:
        description: "Changed (non-generated) files over which a PR is `oversized`."
        type: number
        default: 60
      gate_sensitive_globs:
        description: "Space-separated path globs that force a `full` review even when the diff is small. Setting this REPLACES the default list."
        type: string
        default: "*auth.* */oauth/* oauth.* */authentication/* authentication/* */authorization/* authorization/* */security/* security/* */payments/* payments/* */payment/* payment/* */migrations/* migrations/* */migration/* migration/*"
      gate_promotion_bases:
        description: "Space-separated base branches treated as release targets for promotion detection."
        type: string
        default: "main master production prod"
      gate_promotion_heads:
        description: "Space-separated head branches treated as promotion sources."
        type: string
        default: "staging develop dev release hotfix"
      dev_cache_paths:
        description: "Optional, stack-agnostic. Newline-separated filesystem paths to restore BEFORE the dev-env bring-up — and to warm/save in warm-cache.yml, which needs the same value — so dev-start.sh compiles/installs against a warm build/dependency cache instead of cold every run. Examples: `~/.gradle/caches/modules-2` + `~/.gradle/wrapper` (Gradle), `~/.m2/repository` (Maven), `~/.cache/go-build` + `~/go/pkg/mod` (Go), `~/.cargo` + `target` (Rust), `~/.cache/pip` (Python). Empty (default) disables it — no cache step runs and behaviour is unchanged. Pair with dev_cache_key_files. The pnpm/npm store is already cached separately, so this is for everything else dev-start.sh builds."
        type: string
        default: ""
      dev_cache_key_files:
        description: "Newline-separated file globs whose contents key the cache. The workflow computes the key itself — `<RUNNER_OS>-<RUNNER_ARCH>-<prefix>-<sha of these files>` — inside the jobs where a checkout + runner exist, so you pass globs (not a pre-hashed key): a reusable-workflow caller's `with:` has no runner/checkout, so `runner`/`hashFiles` can't be used there. Point it at the lockfiles/build descriptors that should rotate the cache, e.g. for Gradle: `backend/java/gradle/libs.versions.toml` + `backend/java/**/*.gradle*` + `backend/java/**/gradle-wrapper.properties`. Globs support `**` (globstar). Required when dev_cache_paths is set; if empty the cache is skipped."
        type: string
        default: ""
      dev_cache_key_prefix:
        description: "Optional cache-key prefix (default 'devcache'). The computed key is `<RUNNER_OS>-<RUNNER_ARCH>-<prefix>-<hash of dev_cache_key_files>`, and restore-keys fall back to `<RUNNER_OS>-<RUNNER_ARCH>-<prefix>-` (so a cold PR prefix-matches the latest main-scope entry; caches are repo-scoped, so a cache your main CI writes under the same prefix is reused too). Set it per stack (e.g. 'gradle') so unrelated caches don't collide. Note the arch scoping: a cache your main CI writes under the same prefix is only reused if that CI runs on the same OS+arch."
        type: string
        default: "devcache"
      dev_cache_warm_command:
        description: "Accepted but UNUSED here — this workflow only restores. Pass it to warm-cache.yml, which owns the warm and the save; it is kept in this signature so a caller can hold all four dev_cache_* values in one place and forward them to both workflows."
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Single Claude OAuth token. Either this or CLAUDE_CODE_OAUTH_TOKENS is required."
      CLAUDE_CODE_OAUTH_TOKENS:
        description: "Optional newline-separated pool of Claude OAuth tokens; the picker probes each and picks one with remaining quota."
      CLAUDE_REVIEW_APP_CLIENT_ID:
      CLAUDE_REVIEW_APP_PRIVATE_KEY:
      CLAUDE_REVIEW_APP_SLUG:
      TRACKER_SECRETS:
        description: "Optional newline-separated KEY=VALUE pairs exposed to .github/claude-review/fetch-issue.sh."
      DEV_ENV_SECRETS:
        description: "Optional newline-separated KEY=VALUE pairs exposed to .github/claude-review/dev-start.sh."

# Pinned browser stack, decoupled from consumer-lockfile churn so the
# browser-binary cache hits every run that doesn't bump it.
#
# ONE pin, not two. agent-browser is a single static binary that downloads its
# own Chrome for Testing build, and `agent-browser install` takes no --version:
# the Chrome build is determined by the CLI version. So this key covers the CLI
# and the browser together, and there is no second spec (the old
# @playwright/mcp pin) that can drift away from it.
#
# LOCKSTEP with Panenco/github-action-runners images/versions.env
# (AGENT_BROWSER_VERSION, image G). A mismatch is SILENT: reviews still pass,
# they just re-download the binary instead of using the prebake.
env:
  AGENT_BROWSER_VERSION: "0.34.0"

jobs:
  review:
    name: In-Depth Review
    # THE AUTHORIZATION GATE. A `/review` comment spends Claude quota and boots the
    # dev environment on our runners, and on a public repo anyone can comment — so
    # require write access. OWNER/MEMBER/COLLABORATOR is the write-access triple;
    # CONTRIBUTOR only means "has had a PR merged" and must stay out. It lives at
    # JOB level, not in review-command.sh, so an outsider never claims a runner.
    # The Bot clause is loop protection: this job answers bad commands by posting a
    # comment, which fires issue_comment again.
    #
    # An ALLOWLIST, not a denylist. It used to exclude `pull_request_target` and
    # admit everything else, which was safe only while `pull_request_target` was
    # the sole other trigger a caller was told to wire. Callers now add
    # write-capable triggers for warm-cache.yml (`push`, `schedule`, …), and under
    # a denylist every one of those would have started an unasked review with no
    # PR number to review.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    # Queue, never cancel: a second request is a human asking for something, and two
    # overlapping runs would post two reviews and race on the review-assets branch.
    # Several passes in ONE comment (`/review code functional`) is the fast path.
    concurrency:
      group: claude-review-pr-${{ github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write # screenshot upload to the review-assets branch
      pull-requests: write
      issues: write
      packages: read
    # A PR comment arrives as an `issue` event — the payload has no `pull_request`
    # object at all. Resolved once here so no step re-derives it.
    env:
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}

    steps:
      # workflow_dispatch's github.sha is NOT the PR head — resolve via API
      # and re-verify the head lives in this repo (fork guard for dispatch).
      - name: Resolve PR head SHA
        id: pr_sha
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          date +%s > /tmp/job-start
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::No PR number (event: $GITHUB_EVENT_NAME) — nothing to review."
            case "$GITHUB_EVENT_NAME" in
              pull_request*) echo "::error::This pipeline is ON DEMAND and no longer reviews on push. Trigger the caller on 'issue_comment' (prompts/setup-review.md Step 2) and ask with '/review code'." ;;
              issue_comment) echo "::error::That comment was not on a pull request — the caller's job-level if: should have filtered it." ;;
              *)             echo "::error::Pass the pr_number input." ;;
            esac
            exit 1
          fi
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRepositoryOwner,headRepository,author)
          SHA=$(jq -r '.headRefOid // empty' <<< "$PR_JSON")
          HEAD_OWNER=$(jq -r '.headRepositoryOwner.login // empty' <<< "$PR_JSON")
          HEAD_NAME=$(jq -r '.headRepository.name // empty' <<< "$PR_JSON")
          HEAD_REPO="$HEAD_OWNER/$HEAD_NAME"

          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve PR head SHA for PR #$PR_NUMBER"
            exit 1
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$PR_NUMBER head is in $HEAD_REPO, not $GITHUB_REPOSITORY. Fork PRs are not supported — the PR head must be in the same repository."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "author_is_bot=$(jq -r '.author.is_bot // false' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER head SHA: $SHA (origin $HEAD_REPO)"

      # Full clone: round-2 needs `git diff PRIOR_HEAD...HEAD` to always be
      # computable, so since-last scoping never degrades to a full re-review.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr_sha.outputs.sha }}
          fetch-depth: 0
          filter: blob:none

      # DOGFOOD installs from the local checkout; DOWNSTREAM installs at
      # pipeline_ref (a reusable workflow can't observe its own ref).
      - name: Install review pipeline (dogfood — local checkout)
        if: github.repository == 'panenco/claude-review'
        uses: ./

      - name: Checkout review pipeline at pipeline_ref (downstream)
        if: github.repository != 'panenco/claude-review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: panenco/claude-review
          ref: ${{ inputs.pipeline_ref }}
          path: __claude-review-pipeline

      - name: Install review pipeline (downstream — at pipeline_ref)
        if: github.repository != 'panenco/claude-review'
        uses: ./__claude-review-pipeline

      # Fail loudly here rather than with a bare `exit 127` fourteen minutes
      # later, at the poster, after the whole review has already been paid for.
      - name: Verify the script install resolved
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CLAUDE_REVIEW_SCRIPTS:-}" ] || [ ! -d "$CLAUDE_REVIEW_SCRIPTS" ]; then
            echo "::error::CLAUDE_REVIEW_SCRIPTS is unset or missing — the install step did not run, or action.yml and pr-review.yml are from different versions."
            exit 1
          fi
          for s in post-review.sh review-plan.sh review-command.sh prior-review-state.sh pick-oauth-token.sh setup-dev-env.sh; do
            if [ ! -x "$CLAUDE_REVIEW_SCRIPTS/$s" ]; then
              echo "::error::$CLAUDE_REVIEW_SCRIPTS/$s is missing or not executable."
              exit 1
            fi
          done
          case "$CLAUDE_REVIEW_SCRIPTS" in
            "${GITHUB_WORKSPACE}"/*)
              echo "::error::CLAUDE_REVIEW_SCRIPTS is inside the git workspace ($CLAUDE_REVIEW_SCRIPTS). A subagent's git stash/clean/checkout would delete the pipeline's own scripts mid-run."
              exit 1 ;;
          esac
          echo "Scripts resolved: $CLAUDE_REVIEW_SCRIPTS"

      # Optional GitHub App review identity; falls back to github-actions[bot].
      # APP_SLUG is required because installation tokens can't query /user.
      - name: Generate review token
        id: review_token
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CLAUDE_REVIEW_APP_CLIENT_ID }}
          APP_SLUG: ${{ secrets.CLAUDE_REVIEW_APP_SLUG }}
        run: |
          if [ -n "$APP_CLIENT_ID" ]; then
            if [ -z "$APP_SLUG" ]; then
              echo "::error::CLAUDE_REVIEW_APP_CLIENT_ID is set but CLAUDE_REVIEW_APP_SLUG is not."
              echo "::error::Find your app slug in the App's settings URL (github.com/apps/<slug>) and add it as a repo secret named CLAUDE_REVIEW_APP_SLUG."
              exit 1
            fi
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app_token
        if: steps.review_token.outputs.has_app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUDE_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}

      - name: Resolve review identity
        id: review_identity
        shell: bash
        env:
          HAS_APP: ${{ steps.review_token.outputs.has_app }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ secrets.CLAUDE_REVIEW_APP_SLUG }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$HAS_APP" = "true" ] && [ -n "$APP_TOKEN" ]; then
            BOT_USER="${APP_SLUG}[bot]"
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            BOT_USER="github-actions[bot]"
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          fi
          echo "bot_user=$BOT_USER" >> "$GITHUB_OUTPUT"
          echo "Review identity: $BOT_USER"

      # Which passes did the comment ask for? Depth is not opt-in — review-plan.sh
      # still sizes the PR below. A reusable workflow sees the CALLER's event, so
      # the body needs no `with:` wiring; `inputs.command` covers workflow_dispatch.
      - name: Parse review command
        id: cmd
        shell: bash
        env:
          CMD_BODY: ${{ github.event.comment.body || inputs.command }}
          CMD_TRIGGER: ${{ inputs.command_trigger }}
          CMD_EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          DECISION=$("$CLAUDE_REVIEW_SCRIPTS"/review-command.sh)
          echo "Review command:"; echo "$DECISION" | sed 's/^/  /'
          # No `-e` (repo rule): a failed parse would go green with `proceed` empty and
          # skip everything below, so the request would vanish without a word.
          if ! grep -qE '^action=(run|help|unknown|ignore)$' <<< "$DECISION"; then
            echo "::error::review-command.sh produced no usable decision — refusing to guess which passes were requested."
            exit 1
          fi
          {
            grep -E '^(action|run_functional|native_review|force_deep|passes)=' <<< "$DECISION"
            echo "message<<__CMD_EOF__"
            grep '^message=' <<< "$DECISION" | cut -d= -f2-
            echo "__CMD_EOF__"
          } >> "$GITHUB_OUTPUT"
          ACTION=$(grep '^action=' <<< "$DECISION" | cut -d= -f2)
          if [ "$ACTION" = "run" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No review dispatched (action=$ACTION)."
          fi

      # Tell the reviewer we heard them, without adding comment noise.
      - name: Acknowledge the request
        if: steps.cmd.outputs.proceed == 'true' && github.event_name == 'issue_comment'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review_identity.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -uo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --silent || echo "::warning::Could not react to the triggering comment."

      # A bare or mistyped command must answer — otherwise the reviewer waits for
      # something that never arrives. `ignore` stays silent: it wasn't for us.
      - name: Reply with the command menu
        if: steps.cmd.outputs.proceed != 'true' && steps.cmd.outputs.action != 'ignore' && github.event_name == 'issue_comment'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review_identity.outputs.token }}
          MESSAGE: ${{ steps.cmd.outputs.message }}
        run: |
          set -uo pipefail
          printf '%s\n' "$MESSAGE" | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - \
            || echo "::warning::Could not post the command menu."

      - name: Detect code changes
        id: code_check
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          DOCS_ONLY_PATTERN='^(README|CHANGELOG|CONTRIBUTING|CLAUDE|AGENTS|GEMINI)\.md$|^docs/|^LICENSE$'
          NON_DOCS=$(echo "$FILES" | grep -vE "$DOCS_ONLY_PATTERN" || true)
          if [ -n "$NON_DOCS" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Pure docs PR — skipping build setup."
          fi

      # Deterministic resolver: review_level (full|light) before any agent runs.
      # The comment picks the passes; this picks the depth. `/review deep` overrides
      # it via GATE_FORCE_FULL — the same branch the deep-review label takes.
      # Unit-tested in tests/review_plan_test.sh.
      - name: Resolve review plan
        id: review_plan
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_FORCE_FULL: ${{ steps.cmd.outputs.force_deep }}
          CMD_FUNCTIONAL: ${{ steps.cmd.outputs.run_functional }}
          GATE_SKIP_LABEL: ${{ inputs.gate_skip_label }}
          GATE_DEEP_LABEL: ${{ inputs.gate_deep_label }}
          GATE_SMALL_CEILING: ${{ inputs.gate_small_ceiling }}
          GATE_TINY_CEILING: ${{ inputs.gate_tiny_ceiling }}
          GATE_SIZE_CEILING: ${{ inputs.gate_size_ceiling }}
          GATE_FILE_CEILING: ${{ inputs.gate_file_ceiling }}
          GATE_SENSITIVE_GLOBS: ${{ inputs.gate_sensitive_globs }}
          GATE_PROMOTION_BASES: ${{ inputs.gate_promotion_bases }}
          GATE_PROMOTION_HEADS: ${{ inputs.gate_promotion_heads }}
        run: |
          set -uo pipefail
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json files,baseRefName,headRefName,labels)
          GATE_FILES_TSV=$(jq -r '.files[] | "\(.path)\t\(.additions)\t\(.deletions)"' <<< "$PR_JSON")
          GATE_BASE_REF=$(jq -r '.baseRefName // ""' <<< "$PR_JSON")
          GATE_HEAD_REF=$(jq -r '.headRefName // ""' <<< "$PR_JSON")
          GATE_LABELS=$(jq -r '.labels[].name' <<< "$PR_JSON")
          export GATE_FILES_TSV GATE_BASE_REF GATE_HEAD_REF GATE_LABELS
          PLAN=$("$CLAUDE_REVIEW_SCRIPTS"/review-plan.sh)
          echo "Review plan:"; echo "$PLAN" | sed 's/^/  /'
          {
            grep -E '^(review_level|run_functional|gate)=' <<< "$PLAN"
            echo "reason<<__GATE_EOF__"
            grep '^reason=' <<< "$PLAN" | cut -d= -f2-
            echo "__GATE_EOF__"
          } >> "$GITHUB_OUTPUT"

          # Every step below gates on `functional`, which is the COMMAND's answer, not
          # the plan's — the browser stack and dev-env bring-up are the expensive
          # half of a review and now cost nothing unless somebody typed it. The plan
          # keeps emitting `run_functional` as advice for the test planner.
          # `skip` guard: a skipped review dispatches no agents to hand a browser to.
          LEVEL=$(grep '^review_level=' <<< "$PLAN" | cut -d= -f2)
          if [ "${CMD_FUNCTIONAL:-false}" = "true" ] && [ "$LEVEL" != "skip" ]; then
            echo "functional=true" >> "$GITHUB_OUTPUT"
          else
            echo "functional=false" >> "$GITHUB_OUTPUT"
            if [ "${CMD_FUNCTIONAL:-false}" = "true" ]; then
              echo "::notice::Functional testing was requested but the review plan is 'skip' — no agents run, so there is nothing to exercise."
            fi
          fi

      - name: Set up Node
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      - name: Ensure pnpm on PATH
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true'
        shell: bash
        run: |
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm already present: $(pnpm --version)"
          elif corepack enable pnpm 2>/dev/null && command -v pnpm >/dev/null 2>&1; then
            echo "pnpm via corepack: $(pnpm --version)"
          else
            npm install -g pnpm
            echo "pnpm via npm: $(pnpm --version)"
          fi

      # Restore-only, like the package store below. The review job runs on
      # `issue_comment`, which has READ-ONLY access to the default branch's cache
      # scope — the all-in-one action's post(save) was refused on every
      # comment-triggered review and reported as a warning nobody read. The `id:`
      # is kept although nothing reads its outputs: the install step below is
      # written to be correct on a hit and a miss alike.
      - name: Restore browser assets
        id: ab_cache
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.review_plan.outputs.functional == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # agent-browser keeps browsers, daemon sockets and state under
          # ~/.agent-browser — deliberately NOT under ~/.cache, which the
          # panenco-claude-review scale set masks with a scratch emptyDir. The
          # cache path and the path agent-browser actually looks in are the same
          # directory, so a restore here is a restore the browser will see.
          path: |
            ~/.agent-browser/browsers
            ~/.local/bin/agent-browser
          key: ${{ runner.os }}-${{ runner.arch }}-ab-${{ env.AGENT_BROWSER_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ab-

      - name: Install agent-browser
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.review_plan.outputs.functional == 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/screenshots "$HOME/.local/bin"
          # ~/.local/bin is NOT on PATH on the fleet image (the Claude CLI lives
          # there behind an explicit probe, not a PATH lookup) — put it on PATH
          # for every later step, whether we installed the binary or the image
          # baked it.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          # The npm package is a fat tarball carrying a prebuilt static binary per
          # platform. We extract ONLY the linux-x64 one and skip the JS launcher
          # shim entirely, so nothing here needs Node (the package's
          # `engines: node>=24` gates only that shim). The fleet is amd64
          # throughout — GKE nodes are amd64 and image G hardcodes the /x64
          # toolcache path. Chrome for Testing publishes no linux-arm64 build, so
          # an arm64 runner would need a system Chromium via --executable-path.
          if command -v agent-browser >/dev/null 2>&1 \
            && [ "$(agent-browser --version 2>/dev/null | awk '{print $2}')" = "${AGENT_BROWSER_VERSION}" ]; then
            echo "agent-browser ${AGENT_BROWSER_VERSION} already present (prebaked or cache-restored)."
          else
            ABTMP="$(mktemp -d)"
            if curl -fsSL "https://registry.npmjs.org/agent-browser/-/agent-browser-${AGENT_BROWSER_VERSION}.tgz" \
                 | tar xz -C "$ABTMP" package/bin/agent-browser-linux-x64 \
               && install -m755 "$ABTMP/package/bin/agent-browser-linux-x64" "$HOME/.local/bin/agent-browser"; then
              echo "Installed agent-browser ${AGENT_BROWSER_VERSION}."
            else
              echo "::warning::Could not install agent-browser ${AGENT_BROWSER_VERSION}. The functional tester will CRASH-degrade; the review continues."
            fi
            rm -rf "$ABTMP"
          fi

          # Downloads Chrome for Testing into ~/.agent-browser/browsers. Needs no
          # root: unlike the chrome CHANNEL this replaces (a system apt install to
          # /opt/google/chrome), this is a plain unpack into $HOME. Idempotent —
          # ~0.15s no-op when the image baked it or the cache restored it. The
          # download comes from storage.googleapis.com, which the cluster reaches
          # over Private Google Access rather than the NAT path.
          #
          # `--with-deps` is deliberately NOT passed: it apt-installs Chrome's
          # shared libs and needs root, and image G already inherits them from
          # image B's `playwright install --with-deps`. A runner that lacks them
          # fails the preflight below rather than silently degrading.
          agent-browser install 2>&1 | tail -3 || \
            echo "::warning::agent-browser install failed — the preflight below will report what is missing."

      # Preflight the EXACT path the functional tester takes: does a real headless
      # Chrome launch on this runner? Today's equivalent failure is discovered six
      # turns into the subagent, after the budget is spent; this discovers it here.
      # Non-fatal on purpose — matches the old chrome-channel step's posture: the
      # tester CRASH-degrades and the review still posts.
      - name: Preflight browser
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && steps.review_plan.outputs.functional == 'true'
        shell: bash
        run: |
          set -uo pipefail
          DOC="$(agent-browser doctor --json 2>/dev/null)" || DOC=""
          if [ -z "$DOC" ]; then
            echo "::warning::agent-browser doctor produced no output — functional testing may CRASH-degrade."
            exit 0
          fi
          FAILED="$(printf '%s' "$DOC" | jq -r '
            [.checks[] | select(.id == "chrome.installed" or .id == "launch.elapsed")
                       | select(.status != "pass") | "\(.id): \(.message)"] | join("; ")')"
          if [ -n "$FAILED" ]; then
            # Chrome's sandbox is the usual container-side culprit. The pod does
            # support it (image G's build-time assertion disables it only because
            # buildkit does not), so this is a fallback, not the default.
            echo "Launch preflight failed ($FAILED) — retrying with --no-sandbox."
            export AGENT_BROWSER_ARGS="--no-sandbox,--disable-dev-shm-usage"
            if agent-browser open about:blank >/dev/null 2>&1; then
              echo "AGENT_BROWSER_ARGS=--no-sandbox,--disable-dev-shm-usage" >> "$GITHUB_ENV"
              agent-browser close --all >/dev/null 2>&1 || true
              echo "Browser ready with --no-sandbox."
            else
              echo "::warning::agent-browser cannot launch Chrome on this runner ($FAILED). The functional tester will report CRASH; the review continues."
            fi
          else
            echo "Browser ready: $(printf '%s' "$DOC" | jq -r '.checks[] | select(.id == "chrome.installed") | .message')"
          fi

      # GitHub is the state store: prior verdict + reviewed SHA come straight
      # from the PR's review list. No cross-run artifacts.
      - name: Derive prior review state
        id: prior_state
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BOT_USER: ${{ steps.review_identity.outputs.bot_user }}
        run: |
          set -uo pipefail
          STATE=$("$CLAUDE_REVIEW_SCRIPTS"/prior-review-state.sh)
          echo "Prior review state:"; echo "$STATE" | sed 's/^/  /'
          # No `-e` here (repo rule), and the step's last statement is an `if` —
          # so a failed derivation would set NO outputs and still go green,
          # handing the orchestrator an empty ROUND (that env has no `|| '1'`
          # fallback) and pinning the pipeline to round 1 with no error signal.
          # Fail loudly instead: an unknown round must never review as round 1.
          if ! grep -qE '^round=[0-9]+$' <<< "$STATE"; then
            echo "::error::prior-review-state.sh produced no usable state — refusing to run with an unknown round (would silently review as round 1)."
            exit 1
          fi
          grep -E '^(round|prior_head_sha|prior_verdict)=' <<< "$STATE" >> "$GITHUB_OUTPUT"

      # After prior_state on purpose: the token picker needs the CLI before
      # claude-code-action installs it, and nothing earlier uses either.
      - name: Install Claude CLI (for OAuth token picker)
        id: claude_cli
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        run: |
          # Self-heal a root-owned ~/.local (a root-run step that inherited $HOME, or a
          # runner image that ships one) — the installer only surfaces it as EACCES.
          mkdir -p "$HOME/.local/share" 2>/dev/null || true
          [ -w "$HOME/.local/share" ] || sudo -n chown -R "$(id -u):$(id -g)" "$HOME/.local" 2>/dev/null || true
          if [ -x "$HOME/.local/bin/claude" ]; then
            echo "Claude CLI already installed: $("$HOME/.local/bin/claude" --version)"
          else
            curl -fsSL https://claude.ai/install.sh | bash
            "$HOME/.local/bin/claude" --version
          fi
          # Hand this exact binary to claude-code-action below so it does not fetch a
          # SECOND copy. Its base-action installs unconditionally otherwise:
          #   CLAUDE_CODE_VERSION="2.1.175"
          #   curl -fsSL https://claude.ai/install.sh | bash -s -- $CLAUDE_CODE_VERSION
          # which is ~500MB/job from downloads.claude.ai and was, when measured on the
          # Panenco fleet on 2026-08-12, 5.7% of ALL inbound bytes and the single
          # largest source on the Cloud NAT meter (github-action-runners#96).
          #
          # This is NOT what DISABLE_AUTOUPDATER covers. That switches off the CLI's
          # own updater; this download is an explicit install step in the action, and
          # it ran on every review even though the self-hosted image bakes the CLI.
          #
          # Emitted only when the binary is really there, so a failure upstream leaves
          # the input empty and the action falls back to installing for itself.
          if [ -x "$HOME/.local/bin/claude" ]; then
            echo "path=$HOME/.local/bin/claude" >> "$GITHUB_OUTPUT"
          fi
          # Hand the baked Bun to claude-code-action. It installs one via
          # `oven-sh/setup-bun` unless given `path_to_bun_executable`, which fetches a
          # release tarball from GitHub every job; objects.githubusercontent.com was
          # ~11% of the fleet's metered Cloud NAT bytes (github-action-runners#96).
          # Sampling after the bake shipped showed setup-bun's tool-cache restore
          # landing on only ~64% of jobs, so 4 in 11 still pulled bun-linux-x64.zip
          # despite the binary being present — this makes it deterministic.
          #
          # NO version-skew risk, unlike the CLI handover in #86: the image bakes
          # exactly the version the action's own `bun-version:` pins, which is why
          # BUN_VERSION is pinned in versions.env rather than tracking latest.
          #
          # Emitted only when the binary is really there. The action does NOT stat
          # this path — a wrong value is fail-CLOSED — so on any runner without the
          # bake (ubuntu-latest, an older image) the output stays unset, the input
          # resolves empty, and the action runs setup-bun exactly as it does today.
          if [ -x "$HOME/.local/bin/bun" ]; then
            echo "bun=$HOME/.local/bin/bun" >> "$GITHUB_OUTPUT"
            echo "Baked Bun: $("$HOME/.local/bin/bun" --version)"
          fi

      - name: Pick Claude OAuth token
        id: token_picker
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
        run: |
          "$CLAUDE_REVIEW_SCRIPTS"/pick-oauth-token.sh

      # Restore-only on purpose: the all-in-one cache's post(save) step re-runs
      # hashFiles after dev-start.sh mutates the tree, errors, and reds the
      # check. warm-cache.yml is the saver.
      - name: Restore package-manager store
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.review_plan.outputs.functional == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-pkg-store-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pkg-store-

      # A heavy dev-start.sh can ENOSPC the post steps and lose a complete
      # review; reclaim tooling no app bring-up needs.
      - name: Free up runner disk
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.review_plan.outputs.functional == 'true' && inputs.free_disk_space != 'off'
        shell: bash
        env:
          FREE_MODE: ${{ inputs.free_disk_space }}
        run: |
          set -uo pipefail
          echo "Disk before:"; df -h / | tail -1
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup /usr/share/swift 2>/dev/null || true
          if [ "${FREE_MODE}" = "aggressive" ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet 2>/dev/null || true
            docker image prune -af >/dev/null 2>&1 || true
          fi
          echo "Disk after:"; df -h / | tail -1

      # Generic, opt-in dev build/dependency cache (the dev_cache_* inputs).
      # The key is computed HERE (not passed in) because a reusable-workflow
      # caller's `with:` has no runner/checkout, so it can't use runner/hashFiles
      # — this job does. Restore-ONLY here — after disk cleanup, before the
      # bring-up — so dev-start.sh compiles/installs against a warm cache instead
      # of cold every run. The matching warm/save lives in warm-cache.yml, which
      # a write-capable trigger drives; exactly like the package store, warming
      # in the default-branch scope makes the
      # cache available to every PR, not just re-pushes of the same branch.
      # restore (not the all-in-one cache action) so dev-start.sh mutating the
      # tree can't trigger an all-in-one post(save) re-hash that reds the run.
      - name: Compute dev cache key
        id: dev_cache_meta
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.review_plan.outputs.functional == 'true' && inputs.dev_cache_paths != '' && inputs.dev_cache_key_files != ''
        shell: bash
        env:
          KEY_FILES: ${{ inputs.dev_cache_key_files }}
          KEY_PREFIX: ${{ inputs.dev_cache_key_prefix }}
        run: |
          shopt -s globstar nullglob
          files=()
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            # shellcheck disable=SC2206  # intentional glob + word-split of the pattern
            for f in $pat; do [ -f "$f" ] && files+=( "$f" ); done
          done <<< "$KEY_FILES"
          if [ ${#files[@]} -eq 0 ]; then
            hash="nofiles"
          else
            hash=$(printf '%s\0' "${files[@]}" | sort -zu | xargs -0 sha256sum | sha256sum | cut -c1-16)
          fi
          echo "key=${RUNNER_OS}-${RUNNER_ARCH}-${KEY_PREFIX}-${hash}" >> "$GITHUB_OUTPUT"
          echo "restore=${RUNNER_OS}-${RUNNER_ARCH}-${KEY_PREFIX}-" >> "$GITHUB_OUTPUT"
      - name: Restore dev build cache
        id: dev_build_cache
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.review_plan.outputs.functional == 'true' && inputs.dev_cache_paths != '' && inputs.dev_cache_key_files != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.dev_cache_paths }}
          key: ${{ steps.dev_cache_meta.outputs.key }}
          restore-keys: ${{ steps.dev_cache_meta.outputs.restore }}

      # Detached (setsid/nohup/disown) so the bring-up survives the step
      # boundary; the orchestrator polls /tmp/dev-env/rc + outputs.
      - name: Pre-start dev environment (background)
        if: steps.cmd.outputs.proceed == 'true' && steps.code_check.outputs.needs_build == 'true' && hashFiles('.github/claude-review/dev-start.sh') != '' && steps.review_plan.outputs.functional == 'true'
        id: dev_env_bg
        shell: bash
        env:
          DEV_ENV_SECRETS: ${{ secrets.DEV_ENV_SECRETS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/dev-env
          : > /tmp/dev-env/outputs
          : > /tmp/dev-env/log
          rm -f /tmp/dev-env/rc
          setsid nohup bash -c '
            GITHUB_OUTPUT=/tmp/dev-env/outputs "$CLAUDE_REVIEW_SCRIPTS"/setup-dev-env.sh
            echo $? > /tmp/dev-env/rc
          ' > /tmp/dev-env/log 2>&1 < /dev/null &
          PID=$!
          disown "$PID"
          echo "$PID" > /tmp/dev-env/pid
          echo "Background dev-env launched: PID=$PID (process group leader)"

      # User scope is REQUIRED for BOTH files: claude-code-action's restore-config
      # wipes the workspace .claude/ on PR-head jobs; $HOME survives. Each file only
      # pins its subagent's model and points at its skill. The tester needs no MCP
      # server — the browser is a CLI the subagent drives through Bash.
      - name: Install review subagents
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          MODEL_FUNCTIONAL: ${{ inputs.model_functional }}
          MODEL_STANDARD: ${{ inputs.model_standard }}
        run: |
          mkdir -p "$HOME/.claude/agents"
          envsubst '$MODEL_FUNCTIONAL $CLAUDE_REVIEW_PIPELINE_DIR' \
            < "$CLAUDE_REVIEW_PIPELINE_DIR/agents/review-functional-tester.md" \
            > "$HOME/.claude/agents/review-functional-tester.md"
          echo "Installed review-functional-tester subagent (model=$MODEL_FUNCTIONAL)"
          # Same USER-scope reasoning as above. This one carries the OFFICIAL
          # `code-review` plugin pass: it locates the plugin's own command file at
          # runtime and follows Anthropic's prompt verbatim, writing findings to
          # /tmp/native-findings.json instead of posting them. Its `tools:` line
          # MUST keep `Task` — the plugin prompt fans out to ~10 subagents and does
          # nothing without it. That is not an escape hatch: tool calls are
          # authorised session-wide, so those subagents are held to the same
          # allowlist as this session, and an agent definition's `tools:` frontmatter
          # can only NARROW what the session permits, never widen it.
          envsubst '$MODEL_STANDARD $CLAUDE_REVIEW_PIPELINE_DIR' \
            < "$CLAUDE_REVIEW_PIPELINE_DIR/agents/review-native.md" \
            > "$HOME/.claude/agents/review-native.md"
          echo "Installed review-native subagent (model=$MODEL_STANDARD)"

      # Single top-level agent; all subagents dispatch via Task inside this
      # one invocation. continue-on-error: a max-turns exit may still have
      # written /tmp/review.json — the poster decides from the artifact.
      # Register the Stop hook that ENFORCES "always write /tmp/review.json".
      # The orchestrator skill and the prompt below both already ask for it; on
      # 2026-08-12 asking stopped working (the CLI gained backgrounded agents and
      # the orchestrator yielded with a prose-only turn, ending the session with
      # no artifact). scripts/require-review-json.sh refuses that stop.
      #
      # USER SCOPE, NOT THE WORKSPACE, and that is load-bearing twice over:
      # claude-code-action restores `.claude/` for untrusted PR heads and would
      # wipe a workspace-local hook (the same reason action.yml keeps skills in
      # the action dir), and `--setting-sources user` below is precisely what
      # makes ~/.claude/settings.json the scope that gets read.
      #
      # MERGED, never overwritten: the image may ship its own user settings, and
      # clobbering them would be an invisible regression in something unrelated.
      - name: Enforce review.json on session end
        id: stop_hook
        if: steps.cmd.outputs.proceed == 'true'
        shell: bash
        env:
          HOOK: ${{ env.CLAUDE_REVIEW_PIPELINE_DIR }}/scripts/require-review-json.sh
          # Same enforcement, one level down. The `review-native` subagent follows a
          # plugin prompt that fans out to ~10 Task subagents, and on the first
          # dogfood run of the in-session design it yielded waiting on subagents that
          # had already returned — the #86 failure, inside a subagent. This hook
          # refuses that stop while /tmp/native-findings.json is missing, unparseable
          # or stamped with another PR's number. `SubagentStop` takes no matcher, so
          # the script identifies the native pass from the event payload and FAILS
          # OPEN when it cannot: it must never nudge a judge or the tester.
          SUBAGENT_HOOK: ${{ env.CLAUDE_REVIEW_PIPELINE_DIR }}/scripts/require-native-findings.sh
        run: |
          set -uo pipefail
          for h in "$HOOK" "$SUBAGENT_HOOK"; do
            if [ ! -f "$h" ]; then
              echo "::error::stop hook missing at $h — pipeline install is incomplete"
              exit 1
            fi
            chmod +x "$h" 2>/dev/null || true
          done
          # A stale counter from a previous run on a reused runner would spend
          # this review's nudge budget before it starts.
          #
          # /tmp/native-findings.json is deleted here for a DIFFERENT reason and it
          # is not cosmetic: this fleet reuses runners and /tmp survives between
          # jobs, so a leftover file from a previous PR would be read by the
          # orchestrator's Phase D as this PR's second opinion — another PR's
          # findings posted as inline comments on this one. The file also carries a
          # `pr_number` that Phase D and the hook above both check, so this delete is
          # the first of two independent guards, not the only one.
          rm -f /tmp/review-stop-blocks /tmp/review.json \
                /tmp/native-stop-blocks /tmp/native-findings.json 2>/dev/null || true
          mkdir -p "$HOME/.claude"
          S="$HOME/.claude/settings.json"
          [ -s "$S" ] || echo '{}' > "$S"
          if ! jq empty "$S" >/dev/null 2>&1; then
            echo "::warning::$S was not valid JSON; replacing it with the hook config only"
            echo '{}' > "$S"
          fi
          jq --arg cmd "$HOOK" --arg sub "$SUBAGENT_HOOK" \
            '.hooks.Stop = [{"hooks": [{"type": "command", "command": $cmd}]}]
             | .hooks.SubagentStop = [{"hooks": [{"type": "command", "command": $sub}]}]' \
            "$S" > "$S.tmp" && mv "$S.tmp" "$S" || {
              echo "::error::failed to register the Stop hooks in $S"; exit 1; }
          echo "Stop hook registered: $HOOK"
          echo "SubagentStop hook registered: $SUBAGENT_HOOK"
          jq -c '.hooks' "$S"

      - name: "Review: orchestrate"
        id: claude_run
        if: steps.cmd.outputs.proceed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@ac7e24bf2938964b8ab203e417a2773802392ddd # v1.0.146
        env:
          REVIEW_BOT_USER: ${{ steps.review_identity.outputs.bot_user }}
          PRIOR_HEAD_SHA: ${{ steps.prior_state.outputs.prior_head_sha }}
          PRIOR_VERDICT: ${{ steps.prior_state.outputs.prior_verdict }}
          ROUND: ${{ steps.prior_state.outputs.round }}
          PR_AUTHOR_IS_BOT: ${{ steps.pr_sha.outputs.author_is_bot }}
          DEV_ENV_TIMEOUT_SECONDS: ${{ inputs.dev_env_timeout_seconds }}
          DEV_ENV_SECRETS: ${{ secrets.DEV_ENV_SECRETS }}
          TRACKER_SECRETS: ${{ secrets.TRACKER_SECRETS }}
          # Separate token for the review-assets branch (a custom App token
          # may lack contents: write).
          GITHUB_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_HIGH: ${{ inputs.model_high }}
          MODEL_STANDARD: ${{ inputs.model_standard }}
          MODEL_FAST: ${{ inputs.model_fast }}
          MODEL_FUNCTIONAL: ${{ inputs.model_functional }}
          FUNCTIONAL_BUDGET_SECONDS: ${{ inputs.functional_budget_seconds }}
          # Forces every capture into the one directory the orchestrator
          # publishes from, so a bare `agent-browser screenshot` cannot drop
          # a PNG in the CWD and vanish from the gallery.
          AGENT_BROWSER_SCREENSHOT_DIR: /tmp/screenshots
          REVIEW_LEVEL: ${{ steps.review_plan.outputs.review_level }}
          # The same value the dev-env and browser steps gated on — never the plan's
          # advisory `run_functional`, or the tester lands in an unbuilt environment.
          RUN_FUNCTIONAL: ${{ steps.review_plan.outputs.functional }}
          GATE: ${{ steps.review_plan.outputs.gate }}
          GATE_REASON: ${{ steps.review_plan.outputs.reason }}
          # The orchestrator's Phase B gate. `on` only when the comment asked for it.
          NATIVE_REVIEW: ${{ steps.cmd.outputs.native_review }}
          NATIVE_REVIEW_SCOPE: ${{ inputs.native_review_scope }}
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.review_identity.outputs.token }}
          # Installs the OFFICIAL `code-review` plugin into this session so the
          # `review-native` subagent can read Anthropic's own command prompt at
          # runtime (~/.claude/plugins/**/code-review/commands/code-review.md) and
          # follow it verbatim. We deliberately do NOT vendor a copy of that prompt:
          # reading the installed file keeps Anthropic's rubric canonical and lets it
          # update itself. Both inputs verified present on the pinned action SHA
          # ac7e24bf (action.yml: `plugins`, `plugin_marketplaces`). A failure to
          # install is not fatal to the review — the skill writes an `unavailable`
          # findings file and the orchestrator proceeds without it.
          #
          # UNPINNED ON PURPOSE — an ACCEPTED trade-off, declared in `bugbot.md`
          # ("Accepted supply-chain trade-offs"). Do not re-flag it every round, and
          # do not "fix" it by inventing a ref suffix: the action REJECTS one.
          #
          # Every other third-party reference in this file is SHA-pinned, and
          # `.github/review-config.md` requires that of new Actions YAML. This input
          # is the one place it cannot be honoured today, verified against the pinned
          # action at ac7e24bf (base-action/src/install-plugins.ts):
          #   * `MARKETPLACE_URL_REGEX` is anchored `/^https:\/\/[...]+\.git$/`, so
          #     `...public.git@<sha>`, `...public.git#<ref>` and `...public.git?ref=`
          #     all fail validation with "Invalid marketplace URL format".
          #   * `addMarketplace()` shells out to exactly `claude plugin marketplace
          #     add <url>` — no ref argument is passed and the action exposes no input
          #     for one. `claude plugin marketplace add --help` (CLI 2.1.234) offers
          #     only `--scope` and `--sparse`; there is no `--ref`/`--sha`.
          #   * Claude Code's docs state git-based MARKETPLACE sources support `ref`
          #     (branch/tag) but not `sha`, and `ref` only exists in the
          #     `extraKnownMarketplaces` object form in settings.json, which this
          #     input cannot express.
          #   * `anthropics/claude-plugins-public` publishes no tags and no releases,
          #     so even `ref` would only buy another moving pointer.
          # Revisit when the action grows a ref/sha input (or the marketplace starts
          # tagging releases) — then pin here in the usual `# v1.2.3` house style.
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-public.git
          plugins: |
            code-review@claude-plugins-official
          # Reuse the CLI the step above already guaranteed instead of letting the
          # action download its own pinned copy — see that step for the measurement.
          # Empty when that step was skipped, which restores the action's stock
          # behaviour rather than breaking it.
          path_to_claude_code_executable: ${{ steps.claude_cli.outputs.path }}
          prompt: |
            Read ${{ env.CLAUDE_REVIEW_PIPELINE_DIR }}/skills/review-orchestrator.md and follow it exactly. PR number: ${{ env.PR_NUMBER }}. You are the single top-level agent for this review. Honor the review plan (REVIEW_LEVEL / RUN_FUNCTIONAL / GATE / GATE_REASON) and the round state (ROUND / PRIOR_HEAD_SHA / PRIOR_VERDICT) passed via env. The functional tester is pre-installed as the custom subagent type `review-functional-tester` — dispatch it via the Task tool; it drives the browser itself with the `agent-browser` CLI over Bash. The official Claude `code-review` plugin pass is pre-installed as the custom subagent type `review-native` — dispatch it via the Task tool in the SAME response as the judges and the functional tester (the Phase B fan, per NATIVE_REVIEW) so it overlaps them and adds no wall-clock; it writes /tmp/native-findings.json and NEVER posts to the PR. Your final artifact is /tmp/review.json — ALWAYS write it before exiting, even degraded. Never end a turn with prose only (no tool calls): that terminates the session and crashes the pipeline — every message must contain a tool call until review.json is written.
          # ── THE SANDBOX. `--disallowedTools` is the ONLY thing standing between
          # this job's write scopes and an untrusted prompt. ──
          #
          # This job holds `contents: write` + `pull-requests: write` +
          # `issues: write`, and it runs the OFFICIAL `code-review` plugin prompt
          # (the `review-native` subagent) — fetched at run time from an UNPINNABLE
          # marketplace ref, fanned out over ~10 subagents, reading
          # attacker-controlled PR titles, bodies, diffs and comments. Until this
          # list was tightened, the deleted separate `Native Review` job's
          # `contents: read` + narrow allowlist was the thing that made that safe;
          # moving the plugin in-session lost that posture, and this list restores
          # it. `gh pr review/edit/close`, `gh issue comment` and raw API writes
          # were all reachable before.
          #
          # WHY IT CAN NOW DENY THE RAW API SUBCOMMAND. `--disallowedTools` is
          # SESSION-WIDE: it cannot be scoped to one subagent, so it could not deny
          # the raw `gh` API verb while OUR OWN agents still used it (12 call sites:
          # 5 reads in `skills/review-context-builder.md`, 7 screenshot-upload writes
          # in `skills/review-orchestrator.md`). Those are now extracted verbatim
          # into `scripts/fetch-pr-threads.sh` and `scripts/upload-screenshots.sh`,
          # invoked as `"$CLAUDE_REVIEW_SCRIPTS"/<name>.sh` — reviewed, in-repo, and running
          # as a plain shell command that no deny pattern for a `gh` subcommand
          # matches. No agent in this pipeline needs the raw API verb any more, so
          # nothing legitimate is caught.
          #
          # WHAT STAYS REACHABLE, on purpose: `gh pr view/diff/list`,
          # `gh issue view`, `gh search`, `git log/blame/diff/show`. The plugin
          # prompt's own notes tell it to use `gh` rather than web fetch, and the
          # judges and context builder read the PR the same way. Denying those would
          # break the review; denying the write verbs does not.
          #
          # WHY THE `gh pr comment` ENTRY IS LOAD-BEARING SPECIFICALLY: step 8 of the
          # plugin prompt instructs the model to `gh pr comment` its findings onto
          # the PR. `skills/review-native.md` overrides that (write a file instead),
          # but an instruction is only an instruction — the deny rule makes the
          # override STRUCTURAL, so a stray post cannot bypass the
          # single-consolidated-comment contract even if the plugin's wording wins a
          # turn. This pipeline posts exactly ONE review, and
          # `scripts/post-review.sh` is the only thing allowed to post it.
          #
          # MECHANICS, so nobody "simplifies" this: deny rules are evaluated BEFORE
          # allow rules and cannot be widened by anything downstream — not by a
          # subagent, not by an agent definition's `tools:` frontmatter — and
          # `--permission-mode dontAsk` is what makes the whole list BIND rather than
          # merely auto-approve (in Manual mode `--allowedTools` only AUTO-APPROVES
          # what it lists, and unlisted calls fall through to a `canUseTool` callback
          # claude-code-action never supplies).
          claude_args: |
            --model ${{ inputs.model_standard }}
            --permission-mode dontAsk
            --setting-sources user
            --allowedTools Bash,Read,Write,Glob,Grep,Task,ToolSearch
            --disallowedTools "Edit,WebFetch,WebSearch,Bash(gh api:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr merge:*),Bash(gh pr ready:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh release:*),Bash(git push:*)"
            --max-turns 100
          show_full_output: "true"
          # Empty on any runner that does not bake Bun, which restores the action's
          # own setup-bun step rather than breaking it. See the probe above.
          path_to_bun_executable: ${{ steps.claude_cli.outputs.bun }}

      # The agent-browser daemon outlives the process that started it and idles
      # for an hour by default. This pod requests 8Gi and the pool is Spot: a
      # browser held past the review's end is exactly the saturation
      # `alert-scaleset-at-max-runners` reports. Always, never fatal.
      - name: Stop browser daemon
        if: always()
        shell: bash
        run: agent-browser close --all >/dev/null 2>&1 || true

      # This step's exit code IS the check: green = a review reached the PR
      # (REQUEST_CHANGES included — the blocking signal is the PR review, not
      # the check color), red = pipeline failure.
      - name: Post review + gate
        id: post_review
        if: always() && steps.claude_run.outcome != 'cancelled' && steps.claude_run.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review_identity.outputs.token }}
          GITHUB_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BOT_USER: ${{ steps.review_identity.outputs.bot_user }}
          ANALYZER_OUTCOME: ${{ steps.claude_run.outcome }}
          HEAD_SHA: ${{ steps.pr_sha.outputs.sha }}
          ORCHESTRATOR_EXEC: ${{ steps.claude_run.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ -n "${ORCHESTRATOR_EXEC:-}" ] && [ -f "$ORCHESTRATOR_EXEC" ]; then
            cp "$ORCHESTRATOR_EXEC" /tmp/orchestrator-output.txt 2>/dev/null || true
          fi
          "$CLAUDE_REVIEW_SCRIPTS"/post-review.sh

      - name: Report usage
        if: always() && steps.claude_run.outcome != 'cancelled' && steps.claude_run.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr_sha.outputs.sha }}
          ANALYZER_OUTCOME: ${{ steps.claude_run.outcome }}
          POSTER_OUTCOME: ${{ steps.post_review.outcome }}
          ROUND: ${{ steps.prior_state.outputs.round || '1' }}
        run: |
          set +e
          COST=null; MODELS='[]'; WALL=null; R='{}'
          if [ -f /tmp/orchestrator-output.txt ]; then
            c=$(grep -oE '"total_cost_usd"[[:space:]]*:[[:space:]]*[0-9]+(\.[0-9]+)?' /tmp/orchestrator-output.txt 2>/dev/null \
                  | grep -oE '[0-9]+(\.[0-9]+)?$' | sort -g | tail -1)
            [ -n "$c" ] && COST="$c"
            m=$(grep -oE '"model"[[:space:]]*:[[:space:]]*"claude[^"]*"' /tmp/orchestrator-output.txt 2>/dev/null \
                  | grep -oE 'claude[^"]*' | sort -u | jq -R . | jq -s 'unique' 2>/dev/null)
            echo "$m" | jq -e 'type=="array"' >/dev/null 2>&1 && MODELS="$m"
          fi
          if [ -f /tmp/job-start ]; then
            s=$(cat /tmp/job-start) && WALL=$(( $(date +%s) - s ))
          fi
          [ -f /tmp/review.json ] && jq -e 'type=="object"' /tmp/review.json >/dev/null 2>&1 && R=$(cat /tmp/review.json)
          jq -n \
            --argjson r "$R" --argjson round "$ROUND" --argjson cost "$COST" \
            --argjson models "$MODELS" --argjson wall "$WALL" \
            --arg repo "$GITHUB_REPOSITORY" --arg pr "${PR_NUMBER:-}" \
            --arg run_id "$GITHUB_RUN_ID" --arg attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --arg head "${HEAD_SHA:-}" --arg analyzer "${ANALYZER_OUTCOME:-}" --arg poster "${POSTER_OUTCOME:-}" \
            '{schema_version: 1, repo: $repo, pr_number: ($pr | tonumber? // null),
              run_id: $run_id, run_attempt: ($attempt | tonumber? // 1), head_sha: $head,
              recorded_at: (now | todate), round: $round,
              verdict: ($r.verdict // null),
              findings_count: (($r.meta.findings // []) | length),
              posting_error: (if $poster == "success" then null else "poster outcome: \($poster)" end),
              requires_human_review: ($r.meta.requires_human_review // false),
              technical_change: ($r.meta.technical_change // false),
              functional_strategy: ($r.meta.functional_validation.strategy // null),
              functional_overall: ($r.meta.functional_validation.overall // null),
              screenshot_count: ($r.meta.functional_validation.screenshot_count // 0),
              analyzer_outcome: $analyzer, poster_outcome: $poster,
              claude_cost_usd: $cost, models: $models,
              phases: (if $wall == null then {} else {total: $wall} end)
            }' > /tmp/usage.json
          echo "Wrote /tmp/usage.json:"; cat /tmp/usage.json
          exit 0

      - name: Upload usage record
        if: always() && steps.claude_run.outcome != 'cancelled' && steps.claude_run.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-usage
          path: /tmp/usage.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-${{ env.PR_NUMBER }}
          path: |
            /tmp/review.json
            context.md
            test-plan.md
            screenshots/
            /tmp/screenshots/
            /tmp/orchestrator-output.txt
            /tmp/judge-*.json
            /tmp/functional-*.json
            /tmp/dev-env/log
          if-no-files-found: ignore
          retention-days: 7
