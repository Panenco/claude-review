name: tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'skills/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      # The suite asserts on the pipeline's WIRING too — that the workflow
      # registers both stop hooks, that its deny list denies the raw `gh` API
      # subcommand without catching the reads the plugin needs, and that
      # action.yml verifies every script is installed. A wiring test that does
      # not run when the wiring changes is not a test.
      - 'action.yml'
      - '.github/workflows/pr-review.yml'

jobs:
  shell:
    name: Shell tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq + shellcheck
        run: sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Run dev_env_secrets_test.sh
        run: bash tests/dev_env_secrets_test.sh

      - name: Run pick_oauth_token_test.sh
        run: bash tests/pick_oauth_token_test.sh

      - name: Run review_plan_test.sh
        run: bash tests/review_plan_test.sh

      - name: Run prior_review_state_test.sh
        run: bash tests/prior_review_state_test.sh

      - name: Run post_review_test.sh
        run: bash tests/post_review_test.sh

      - name: Run require_review_json_test.sh
        run: bash tests/require_review_json_test.sh

      - name: Run require_native_findings_test.sh
        run: bash tests/require_native_findings_test.sh

      - name: Run fetch_pr_threads_test.sh
        run: bash tests/fetch_pr_threads_test.sh

      - name: Run upload_screenshots_test.sh
        run: bash tests/upload_screenshots_test.sh

      - name: Shellcheck scripts (error-level only)
        run: shellcheck --severity=error scripts/*.sh tests/*.sh
