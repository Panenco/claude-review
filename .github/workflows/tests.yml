name: tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'skills/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      # The suite asserts on the pipeline's WIRING too — that the workflow
      # registers both stop hooks, that its deny list denies the raw `gh` API
      # subcommand without catching the reads the plugin needs, and that
      # action.yml verifies every script is installed. A wiring test that does
      # not run when the wiring changes is not a test.
      - 'action.yml'
      - '.github/workflows/pr-review.yml'
      # review_command_test.sh asserts on the CALLER too — that it triggers on
      # issue_comment and not pull_request. A wiring test that does not run when
      # the wiring changes is not a test.
      - '.github/workflows/claude-review.yml'
      - 'broker/**'
      - 'infra/**'

jobs:
  shell:
    name: Shell tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq + shellcheck
        run: sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Run dev_env_secrets_test.sh
        run: bash tests/dev_env_secrets_test.sh

      - name: Run pick_oauth_token_test.sh
        run: bash tests/pick_oauth_token_test.sh

      - name: Run review_plan_test.sh
        run: bash tests/review_plan_test.sh

      - name: Run review_command_test.sh
        run: bash tests/review_command_test.sh

      - name: Run prior_review_state_test.sh
        run: bash tests/prior_review_state_test.sh

      - name: Run post_review_test.sh
        run: bash tests/post_review_test.sh

      - name: Run require_review_json_test.sh
        run: bash tests/require_review_json_test.sh

      - name: Run require_native_findings_test.sh
        run: bash tests/require_native_findings_test.sh

      - name: Run fetch_pr_threads_test.sh
        run: bash tests/fetch_pr_threads_test.sh

      - name: Run upload_screenshots_test.sh
        run: bash tests/upload_screenshots_test.sh

      - name: Shellcheck scripts (error-level only)
        run: shellcheck --severity=error scripts/*.sh tests/*.sh infra/*.sh

  broker:
    name: Broker tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            broker/package-lock.json
            infra/package-lock.json

      - name: Broker — install, build, test
        working-directory: broker
        run: |
          npm ci
          npm test

      # The Pulumi program has no unit tests (every resource is a cloud call),
      # so tsc is the gate: it catches a renamed provider field, which is the
      # failure mode that would otherwise surface halfway through a deploy.
      - name: Infra — typecheck
        working-directory: infra
        run: |
          npm ci
          npm run typecheck

      # The image is what actually runs. Without this, a broken Dockerfile
      # surfaces during `pulumi up`, in front of whoever is deploying.
      - name: Broker — image builds
        run: docker build -t claude-token-broker:ci broker/
