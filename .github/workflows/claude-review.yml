name: Claude PR Review

# ON DEMAND — nothing reviews on push. Comment `/review code | functional | all`
# on a PR; combine passes in one comment for a single review.
#
# No `pull_request_target`. It used to be here to run the warm-cache job, but that
# trigger has READ-ONLY access to the default branch's cache scope, so the warm
# stored nothing. The warm now lives in claude-review-warm.yml, on a trigger that
# can write. See panenco/claude-review#101.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      command:
        description: 'Passes to run, e.g. "/review code functional". Empty = code review only.'
        required: false
        type: string

# Requests queue rather than cancel — a human asked for each one. Dispatch gets a
# per-invocation group so it never blocks on a comment-driven run.
concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # Filter, not security: without it every comment opens a run that only skips
    # itself. Authorization is the author_association gate in the called workflow.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review'))
    # This repo IS panenco/claude-review, so we call the reusable workflow
    # via its local path rather than `panenco/claude-review/.github/workflows/
    # pr-review.yml@v3`. Two reasons:
    #   1. The `org/repo/...@tag` form trips a `startup_failure` here even
    #      with explicit secret mappings — the cross-repo treatment of
    #      same-repo reusable calls is the documented quirk in
    #      `prompts/setup-review.md` Step 2.
    #   2. The local path exercises the in-PR copy of pr-review.yml, which
    #      is a stronger dogfood: orchestration changes in a PR get tested
    #      on that PR's own review run.
    uses: ./.github/workflows/pr-review.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: read
      id-token: write # for the coming per-developer Claude seats; inert until then
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      # Empty on the comment path: the called workflow reads the body off THIS
      # caller's event. Only dispatch, which has no comment, forwards one.
      command: ${{ inputs.command || '' }}
      # MUST stay explicit. The `runner` default is `panenco-claude-review`,
      # whose org runner group is created with `allows_public_repositories:
      # false` — and THIS repo is public. It can never place a job on that
      # fleet, and ARC fails closed rather than falling back: inheriting the
      # default here would queue every review for GitHub's 24h timeout and
      # then fail. Any other public consumer needs this same line.
      runner: ubuntu-latest
      # No `pipeline_ref`: the dogfood install (`uses: ./`) already comes from the
      # PR-head checkout, and on a comment event `github.sha` is main's tip — a
      # head-SHA-looking pin here would quietly mean "main".
    secrets: inherit
