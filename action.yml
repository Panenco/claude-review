name: 'Install Claude Review Pipeline'
description: 'Copies review scripts into the workspace and exports CLAUDE_REVIEW_PIPELINE_DIR so the reusable workflow can read skills and agents directly from the action directory'
runs:
  using: composite
  steps:
    - name: Install pipeline files
      shell: bash
      run: |
        set -euo pipefail
        PIPELINE_DIR="${{ github.action_path }}"

        # Verify the action download is complete — catch a broken release here
        # instead of a cryptic "skill not found" mid-review.
        EXPECTED_SKILLS="review-orchestrator review-scan review-verify review-functional-tester"
        MISSING=""
        for s in $EXPECTED_SKILLS; do
          if [ ! -f "$PIPELINE_DIR/skills/${s}.md" ]; then
            MISSING="$MISSING skills/${s}.md"
          fi
        done
        for a in review-scan review-verify review-functional-tester; do
          if [ ! -f "$PIPELINE_DIR/agents/${a}.md" ]; then
            MISSING="$MISSING agents/${a}.md"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "::error::panenco/claude-review install is incomplete — missing:$MISSING"
          echo "::error::Action download path: $PIPELINE_DIR"
          echo "::error::This indicates a broken release. Pin to a known-good SHA or open an issue on panenco/claude-review."
          ls -la "$PIPELINE_DIR/skills/" "$PIPELINE_DIR/agents/" 2>&1 || true
          exit 1
        fi
        # require-review-json.sh is the Stop hook the workflow registers in
        # ~/.claude/settings.json. It is checked here with the rest because a
        # missing hook fails OPEN — the review would run, yield, and crash with
        # no artifact, which is the exact 2026-08-12 failure it exists to stop.
        #
        # upload-screenshots.sh holds EVERY raw GitHub REST/GraphQL call the
        # pipeline makes. It is checked here because the review session's
        # `--disallowedTools` denies the raw `gh` API subcommand outright:
        # without it an agent that needs one has no fallback path at all, and the
        # failure would surface as a mid-review "command not found" rather than
        # an install error.
        # Without review-command.sh the run goes green having reviewed nothing, which
        # reads as "the bot ignored me" rather than as a broken install.
        for s in post-review.sh setup-dev-env.sh pick-oauth-token.sh guard.sh review-command.sh prior-review-state.sh require-review-json.sh upload-screenshots.sh; do
          if [ ! -f "$PIPELINE_DIR/scripts/${s}" ]; then
            echo "::error::panenco/claude-review install is incomplete — missing script: ${s}"
            exit 1
          fi
        done

        # Export the action's directory so the reusable workflow can read
        # skills/ and agents/ directly from it. We do NOT copy them into the
        # workspace: claude-code-action restores `.claude/` for "untrusted"
        # PR heads, which would wipe anything placed there. The action dir
        # sits outside the workspace and survives the restore.
        echo "CLAUDE_REVIEW_PIPELINE_DIR=$PIPELINE_DIR" >> "$GITHUB_ENV"

        # Scripts go OUTSIDE the workspace, for the same class of reason the
        # skills do. They used to land in `$GITHUB_WORKSPACE/.review-scripts`,
        # where they were UNTRACKED files inside a git repo that review
        # subagents run arbitrary git commands against. On run 32648014030 a
        # judge ran `git stash -u` to test the base revision, which swallowed
        # `.review-scripts/` along with the working tree; it never popped, and
        # the poster four minutes later died with `post-review.sh: No such file
        # or directory` after a completed 14-minute review. `git clean -fd`,
        # `git checkout -- .` and a `.claude/` restore are the same hazard.
        # $RUNNER_TEMP is on the runner, outside every worktree, so no git
        # command an agent can reach touches it.
        SCRIPTS_DIR="${RUNNER_TEMP:-/tmp}/review-scripts"
        mkdir -p "$SCRIPTS_DIR"
        cp "$PIPELINE_DIR"/scripts/*.sh "$SCRIPTS_DIR"/
        chmod +x "$SCRIPTS_DIR"/*.sh
        echo "CLAUDE_REVIEW_SCRIPTS=$SCRIPTS_DIR" >> "$GITHUB_ENV"
        echo "Pipeline dir: $PIPELINE_DIR"
        echo "Skills available: $(ls "$PIPELINE_DIR"/skills/review-*.md | wc -l) at $PIPELINE_DIR/skills"
        echo "Agents available: $(ls "$PIPELINE_DIR"/agents/*.md | wc -l) at $PIPELINE_DIR/agents"
        echo "Scripts installed: $(ls "$SCRIPTS_DIR"/*.sh | wc -l) at $SCRIPTS_DIR"
